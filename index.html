/* =====================================================================
   DESIGN SYSTEM · écrit une seule fois, réutilisé partout
   Style : glassmorphism noir « liquid UI » · mode sombre uniquement
   Règle des couleurs : 60 % fond neutre, 30 % principale (blanc), 10 % accent (or)
   ===================================================================== */
:root {
  /* Couleurs de la palette */
  --c-fond: #000000;
  --c-carte: #050505;
  --c-texte: #E0AE28;
  --c-texte-doux: rgba(224, 174, 40, 0.78);
  --c-principale: #FFFFFF;
  --c-principale-douce: rgba(255, 255, 255, 0.72);
  --c-accent: #E0AE28;
  --c-grenat: #A3263B;
  /* Couleurs de signal, sobres, toujours avec une icône et un mot */
  --c-vert: #45C486;
  --c-orange: #F0913A;
  --c-rouge: #F0566B;
  --c-bleu: #6CB4F5;
  --c-gris: #9A9A9A;
  /* Verre noir laqué */
  --verre-fond: rgba(5, 5, 5, 0.66);
  --verre-bord: rgba(255, 255, 255, 0.10);
  --verre-reflet: rgba(255, 255, 255, 0.06);
  --verre-flou: blur(18px) saturate(140%);
  /* Polices : 2 au maximum */
  --police-titre: "Cinzel", "Times New Roman", serif;
  --police-texte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Échelle de texte fixe */
  --t-titre: 40px;
  --t-sous-titre: 24px;
  --t-cle: clamp(56px, 7vw, 104px);
  --t-texte: 16px;
  --t-legende: 13px;
  /* Espacements : échelle de 8 px */
  --e-1: 8px;
  --e-2: 16px;
  --e-3: 24px;
  --e-4: 32px;
  --e-5: 40px;
  --e-6: 48px;
  --e-8: 64px;
  --e-12: 96px;
  /* Rayons */
  --r-1: 8px;
  --r-2: 16px;
  --r-3: 24px;
  --r-rond: 999px;
  /* Ombres */
  --ombre-1: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 16px 40px rgba(0, 0, 0, 0.65);
  --ombre-2: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 24px 64px rgba(0, 0, 0, 0.8);
  /* Mise en page */
  --rail: 80px;
  --menu-ouvert: 360px;
  --duree: 200ms;
  --courbe: cubic-bezier(.2, .8, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--c-fond); }
html.verrou body { visibility: hidden; }
html.encadre body > * { display: none !important; }
html.encadre body::before {
  content: "Cette application ne peut pas être affichée à l'intérieur d'un autre site.";
  display: block; padding: var(--e-5); color: var(--c-texte); font: 300 var(--t-texte) var(--police-texte);
}
body {
  margin: 0; min-height: 100vh; overflow-x: hidden;
  background: var(--c-fond); color: var(--c-texte);
  font-family: var(--police-texte); font-weight: 300; font-size: var(--t-texte); line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3 { font-family: var(--police-titre); font-weight: 400; color: var(--c-principale); margin: 0; letter-spacing: 0.02em; }
h1 { font-size: var(--t-titre); line-height: 1.15; }
h2 { font-size: var(--t-sous-titre); line-height: 1.25; }
h3 { font-size: var(--t-texte); line-height: 1.35; letter-spacing: 0.04em; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 3px; border-radius: 6px; }
#titre-page:focus, #contenu:focus { outline: none; }
.chiffre, .num { font-family: var(--police-titre); font-weight: 400; font-variant-numeric: tabular-nums lining-nums; color: var(--c-principale); }
.unite { font-family: var(--police-titre); color: var(--c-accent); }
.legende { font-size: var(--t-legende); color: var(--c-texte-doux); }
.visuellement-cache { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.lien-evitement { position: fixed; top: var(--e-1); left: var(--e-1); z-index: 200; padding: var(--e-1) var(--e-2); background: var(--c-accent); color: #000; border-radius: var(--r-1); transform: translateY(-200%); }
.lien-evitement:focus-visible { transform: none; }
svg.icone.grand { width: 56px; height: 56px; color: var(--c-accent); stroke-width: 1.2; }
.volet .seulement-rail { display: none !important; }
svg.icone { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Fond animé noir liquid UI ---------- */
.fond { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: #000; }
.fond .reflets {
  position: absolute; inset: -30%;
  background:
    radial-gradient(38% 32% at 22% 18%, rgba(46, 46, 46, 0.55), rgba(0, 0, 0, 0) 70%),
    radial-gradient(34% 30% at 78% 72%, rgba(36, 36, 36, 0.50), rgba(0, 0, 0, 0) 70%),
    radial-gradient(26% 22% at 62% 28%, rgba(28, 28, 28, 0.45), rgba(0, 0, 0, 0) 70%),
    radial-gradient(30% 26% at 30% 82%, rgba(24, 24, 24, 0.40), rgba(0, 0, 0, 0) 70%);
  animation: glisse 26s ease-in-out infinite alternate;
}
.fond .lustre {
  position: absolute; inset: -50%;
  background: linear-gradient(115deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.035) 50%, rgba(255, 255, 255, 0) 58%);
  animation: lustre 28s linear infinite;
}
.fond canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
@keyframes glisse { 0% { transform: translate3d(-4%, -3%, 0) scale(1); } 50% { transform: translate3d(3%, 2%, 0) scale(1.06); } 100% { transform: translate3d(-2%, 4%, 0) scale(1.02); } }
@keyframes lustre { 0% { transform: translate3d(-30%, 0, 0); } 100% { transform: translate3d(30%, 0, 0); } }

/* ---------- Verre noir laqué (cartes, panneaux) ---------- */
.verre {
  position: relative; isolation: isolate;
  background: linear-gradient(180deg, var(--verre-reflet), rgba(255, 255, 255, 0) 38%), var(--verre-fond);
  border: 1px solid var(--verre-bord); border-radius: var(--r-3);
  -webkit-backdrop-filter: var(--verre-flou); backdrop-filter: var(--verre-flou);
  box-shadow: var(--ombre-1);
}
.verre::before {
  content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: 1px; z-index: -1;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0));
}

/* ---------- Structure générale ---------- */
.app { position: relative; z-index: 1; }
.contenu { margin-left: var(--rail); padding: var(--e-5) var(--e-5) var(--e-12); max-width: calc(1440px + var(--rail)); }
.contenu > * + * { margin-top: var(--e-4); }
.section-titre { display: flex; align-items: baseline; justify-content: space-between; gap: var(--e-2); flex-wrap: wrap; margin-bottom: var(--e-3); }
.section-titre p { font-size: var(--t-legende); color: var(--c-texte-doux); }
.surtitre { font-size: var(--t-legende); letter-spacing: 0.16em; text-transform: uppercase; color: var(--c-texte-doux); }

/* ---------- Menu latéral : rail d'icônes, déplié au survol ---------- */
.menu {
  position: fixed; inset: 0 auto 0 0; z-index: 60; width: var(--rail);
  display: flex; flex-direction: column; overflow: hidden auto; overscroll-behavior: contain;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 30%), rgba(2, 2, 2, 0.82);
  border-right: 1px solid var(--verre-bord);
  -webkit-backdrop-filter: var(--verre-flou); backdrop-filter: var(--verre-flou);
  transition: width var(--duree) var(--courbe), box-shadow var(--duree);
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .15) transparent;
}
.menu:hover, .menu:focus-within, .menu.ouvert { width: var(--menu-ouvert); box-shadow: 24px 0 64px rgba(0, 0, 0, 0.7); }
.marque { display: flex; align-items: center; gap: var(--e-2); min-height: 80px; padding: 0 0 0 20px; color: var(--c-principale); text-decoration: none; }
.marque .logo { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--verre-bord); background: #000; }
.marque .logo svg { width: 24px; height: 24px; stroke: var(--c-accent); }
.marque .nom { font-family: var(--police-titre); font-size: 15px; line-height: 1.2; white-space: nowrap; }
.marque .nom small { display: block; font-family: var(--police-texte); font-size: 12px; color: var(--c-texte-doux); letter-spacing: .08em; }
.libelle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity var(--duree); }
.menu:not(:hover):not(:focus-within):not(.ouvert) .libelle,
.menu:not(:hover):not(:focus-within):not(.ouvert) .marque .nom { opacity: 0; }
.menu:not(:hover):not(:focus-within):not(.ouvert) .seulement-ouvert { display: none; }
.menu:hover .seulement-rail, .menu:focus-within .seulement-rail, .menu.ouvert .seulement-rail { display: none; }
.nav-liste { list-style: none; margin: 0; padding: var(--e-1) 0; }
.nav-item { position: relative; }
.nav-lien {
  display: flex; align-items: center; gap: var(--e-2); min-height: 48px; margin: 2px 12px; padding: 0 14px;
  border-radius: 14px; text-decoration: none; color: var(--c-texte); cursor: pointer; border: 1px solid transparent;
  transition: background var(--duree), border-color var(--duree), color var(--duree);
}
.nav-lien:hover { background: rgba(255, 255, 255, 0.04); }
.nav-lien[aria-current="page"] { color: var(--c-principale); background: rgba(255, 255, 255, 0.06); border-color: var(--verre-bord); }
.nav-lien .libelle { flex: 1; min-width: 0; }
.nav-famille { display: flex; align-items: center; margin: 2px 12px 2px 12px; }
.nav-famille .nav-lien { flex: 1; margin: 0; min-width: 0; }
.nav-famille .nav-lien .libelle { white-space: normal; line-height: 1.25; padding: 6px 0; }
.menu:not(:hover):not(:focus-within):not(.ouvert) .nav-famille .nav-lien .libelle { white-space: nowrap; }
.deplier {
  width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 0;
  background: transparent; color: var(--c-texte-doux); cursor: pointer; transition: transform var(--duree), background var(--duree);
}
.deplier:hover { background: rgba(255, 255, 255, 0.05); }
.deplier[aria-expanded="true"] svg { transform: rotate(90deg); }
.deplier svg { transition: transform var(--duree); width: 16px; height: 16px; }
.nav-sous { list-style: none; margin: 0 0 var(--e-1); padding: 0 0 0 52px; }
.nav-sous .nav-lien { min-height: 40px; margin: 1px 12px 1px 0; font-size: 14px; gap: var(--e-1); padding: 0 10px; }
.nav-sous .code { font-family: var(--police-titre); color: var(--c-accent); font-size: 12px; flex: none; }
.nav-groupe { padding: var(--e-2) 0 var(--e-1) 34px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--c-texte-doux); white-space: nowrap; }
.point-feu { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c-gris); box-shadow: 0 0 10px currentColor; }
.point-feu.vert { background: var(--c-vert); color: var(--c-vert); }
.point-feu.orange { background: var(--c-orange); color: var(--c-orange); }
.point-feu.rouge { background: var(--c-rouge); color: var(--c-rouge); }
.point-feu.neutre { background: var(--c-gris); color: transparent; }
.icone-feu-rail { position: absolute; top: 9px; left: 46px; }
body.disjoncte .point-feu, body.disjoncte .nav-lien .pastille { visibility: hidden; }

/* ---------- Pastilles de statut : couleur + icône + mot ---------- */
.pastille {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--r-rond);
  font-size: var(--t-legende); line-height: 1.4; white-space: nowrap; border: 1px solid currentColor; color: var(--c-gris);
  background: rgba(0, 0, 0, 0.4);
}
.pastille svg { width: 14px; height: 14px; stroke-width: 2; }
.pastille.vert { color: var(--c-vert); }
.pastille.orange { color: var(--c-orange); }
.pastille.rouge { color: var(--c-rouge); }
.pastille.neutre { color: var(--c-gris); }
.nav-lien .pastille { padding: 1px 8px 1px 6px; font-size: 12px; }
.nav-lien .pastille svg { width: 12px; height: 12px; }

/* ---------- Panneau de synchronisation ---------- */
.sync { margin: var(--e-2) 12px var(--e-3); padding: var(--e-2); border-radius: var(--r-2); }
.sync-rail { display: grid; place-items: center; position: relative; width: 56px; height: 48px; margin: var(--e-2) 12px; border-radius: 14px; border: 1px solid var(--verre-bord); color: var(--c-texte); background: rgba(0, 0, 0, .4); }
.sync-rail .point-etat { position: absolute; top: 9px; right: 11px; }
.sync-entete { display: flex; align-items: center; justify-content: space-between; gap: var(--e-1); }
.sync-entete .titre { display: flex; align-items: center; gap: var(--e-1); color: var(--c-principale); font-size: 14px; }
.interrupteur {
  position: relative; width: 44px; height: 24px; flex: none; padding: 0; border-radius: var(--r-rond); cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.18); background: #3a3a3a; transition: background var(--duree), border-color var(--duree);
}
.interrupteur::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: #000; box-shadow: 0 1px 3px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .25) inset; transition: transform 200ms var(--courbe), background 200ms;
}
.interrupteur[aria-checked="true"] { background: var(--c-principale); border-color: var(--c-principale); }
.interrupteur[aria-checked="true"]::after { transform: translateX(20px); background: #000; }
.interrupteur[aria-checked="false"]::after { background: #d9d9d9; }
.etat { display: flex; align-items: flex-start; gap: var(--e-1); margin-top: 12px; font-size: 14px; color: var(--c-principale-douce); }
.etat .mot { color: var(--c-principale); }
.point-etat { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--c-gris); }
.point-etat.ok { background: var(--c-vert); box-shadow: 0 0 0 0 rgba(69, 196, 134, .6); animation: pulse 2.4s ease-out infinite; }
.point-etat.pause { background: var(--c-gris); }
.point-etat.lecture { background: var(--c-bleu); }
.point-etat.reconnexion { background: var(--c-orange); }
.point-etat.erreur { background: var(--c-rouge); }
.point-etat.aucun { background: transparent; border: 1px solid var(--c-gris); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(69, 196, 134, .55); } 70% { box-shadow: 0 0 0 8px rgba(69, 196, 134, 0); } 100% { box-shadow: 0 0 0 0 rgba(69, 196, 134, 0); } }
.sync-infos { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.sync-infos dt { color: var(--c-texte-doux); }
.sync-infos dd { margin: 0; color: var(--c-principale-douce); min-width: 0; overflow-wrap: anywhere; }
.sync-raison { margin-top: 8px; font-size: 13px; color: var(--c-principale-douce); }
.sync-actions { display: grid; gap: var(--e-1); margin-top: 12px; }
.sync-note { margin-top: var(--e-1); font-size: 12px; color: var(--c-texte-doux); }

/* ---------- Boutons premium ---------- */
.bouton {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e-1); min-height: 44px; padding: 0 var(--e-3);
  border-radius: var(--r-rond); border: 1px solid var(--verre-bord); background: rgba(255, 255, 255, 0.03); color: var(--c-principale);
  font-size: 14px; letter-spacing: 0.02em; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform var(--duree) var(--courbe), background var(--duree), border-color var(--duree), box-shadow var(--duree);
}
.bouton:hover { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
.bouton:active { transform: translateY(0); }
.bouton.principal {
  color: #000; border-color: var(--c-accent);
  background: linear-gradient(180deg, #F3C64A, var(--c-accent) 55%, #B98B14);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 10px 28px rgba(224, 174, 40, 0.22);
}
.bouton.principal:hover { box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 14px 36px rgba(224, 174, 40, 0.32); }
.bouton.petit { min-height: 36px; padding: 0 var(--e-2); font-size: 13px; }
.bouton.discret { border-color: transparent; background: transparent; color: var(--c-texte-doux); }
.bouton.discret:hover { color: var(--c-texte); background: rgba(255, 255, 255, .04); }
.bouton.plein { width: 100%; }
.bouton .icone { width: 18px; height: 18px; }

/* ---------- Fil d'Ariane ---------- */
.ariane ol { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--e-1); margin: 0; padding: 0; font-size: var(--t-legende); }
.ariane li { display: inline-flex; align-items: center; gap: var(--e-1); color: var(--c-texte-doux); }
.ariane li + li::before { content: "→"; color: rgba(224, 174, 40, .5); }
.ariane a { text-decoration: none; color: var(--c-texte); border-bottom: 1px solid rgba(224, 174, 40, .3); }
.ariane a:hover { border-bottom-color: var(--c-texte); }
.ariane [aria-current="page"] { color: var(--c-principale); }

/* ---------- Héros : la réponse principale, en grand ---------- */
.heros { padding: var(--e-5); border-radius: 32px; box-shadow: var(--ombre-2); }
.heros h1 { max-width: 22ch; margin-top: var(--e-2); }
.heros .message { margin-top: var(--e-3); max-width: 72ch; font-size: 18px; color: var(--c-texte); }
.heros .reponse { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--e-2) var(--e-5); margin-top: var(--e-4); }
.heros .reponse .bloc { min-width: 0; }
.heros .reponse .valeur { font-size: var(--t-cle); line-height: 1; }
.heros .reponse .valeur .unite { font-size: 0.32em; margin-left: 0.2em; }
.heros .fleche { font-family: var(--police-titre); font-size: 40px; color: var(--c-accent); padding-bottom: 14px; }
.heros .etiquette { font-size: var(--t-legende); color: var(--c-texte-doux); margin-bottom: var(--e-1); letter-spacing: 0.08em; text-transform: uppercase; }
.heros .pied { display: flex; flex-wrap: wrap; gap: var(--e-1) var(--e-2); align-items: center; margin-top: var(--e-4); }

/* ---------- Tuiles des flux ---------- */
.grille-flux { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e-2); }
.tuile { padding: var(--e-3); border-radius: var(--r-3); min-width: 0; transition: transform var(--duree) var(--courbe), border-color var(--duree); }
.tuile:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, .18); }
.tuile .code { font-family: var(--police-titre); font-size: var(--t-legende); color: var(--c-accent); letter-spacing: .1em; }
.tuile .nom { margin-top: 4px; font-size: 14px; color: var(--c-texte); min-height: 2.6em; }
.tuile .valeur { margin-top: var(--e-2); font-size: 40px; line-height: 1.05; overflow-wrap: anywhere; }
.tuile .valeur .unite { font-size: 15px; margin-left: 6px; }
.tuile.total { border-color: rgba(255, 255, 255, 0.2); }

/* ---------- Cartes KPI très grand format ---------- */

/* Protection contre l'affichage du site dans une fausse page (iframe) */
const estEncadre = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
if (estEncadre) {
  document.documentElement.classList.add("encadre");
}
document.documentElement.classList.remove("verrou");

/* Erreur « métier » : son message est écrit pour l'utilisateur, sans détail technique */
class ErreurLecture extends Error {
  constructor(message, details, reessayable) { super(message); this.name = "ErreurLecture"; this.details = details || []; this.reessayable = !!reessayable; }
}

/* Contrôle du fichier avant toute lecture : extension, taille, signature binaire */
function controlerFichierAvantLecture(nom, taille) {
  const nomMin = String(nom || "").toLowerCase();
  const ext = FORMAT_ATTENDU.extensions.find(e => nomMin.endsWith(e));
  if (!ext) {
    throw new ErreurLecture("Format refusé : seuls les fichiers .xlsx, .xlsm, .xls et .csv sont acceptés.");
  }
  if (taille > FORMAT_ATTENDU.tailleMaxOctets) {
    throw new ErreurLecture("Fichier trop volumineux (" + formaterNombre(taille / 1048576, 1) + " Mo) : la limite est de 10 Mo.");
  }
  if (taille === 0) {
    throw new ErreurLecture("Le fichier est vide ou en cours d'enregistrement.", [], true);
  }
  return ext;
}

function controlerSignature(ext, octets) {
  const b = octets;
  const zip = b.length > 4 && b[0] === 0x50 && b[1] === 0x4B && b[2] === 0x03 && b[3] === 0x04;
  const ole = b.length > 8 && b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0 && b[4] === 0xA1 && b[5] === 0xB1 && b[6] === 0x1A && b[7] === 0xE1;
  if ((ext === ".xlsx" || ext === ".xlsm") && !zip) {
    throw new ErreurLecture("Ce fichier porte l'extension " + ext + " mais ce n'est pas un vrai classeur Excel.");
  }
  if (ext === ".xls" && !ole) {
    throw new ErreurLecture("Ce fichier porte l'extension .xls mais ce n'est pas un vrai classeur Excel.");
  }
  if (ext === ".csv") {
    const n = Math.min(b.length, 8192);
    for (let i = 0; i < n; i++) {
      if (b[i] === 0) throw new ErreurLecture("Ce fichier porte l'extension .csv mais ce n'est pas un fichier texte.");
    }
  }
}

/* Protection des exports Excel contre les formules piégées */
function neutraliserCellule(valeur) {
  if (typeof valeur !== "string") return valeur;
  return /^[=+\-−@\t\r\n]/.test(valeur) ? "'" + valeur : valeur;
}

/* Les noms de colonnes dangereux sont ignorés (pollution d'objets) */
function estColonneInterdite(texte) {
  const t = String(texte == null ? "" : texte).trim().toLowerCase();
  return FORMAT_ATTENDU.colonnesInterdites.includes(t);
}

/* Création d'éléments sans jamais interpréter de HTML : textContent et createElement uniquement */
function el(balise, attributs, enfants) {
  const noeud = document.createElement(balise);
  if (attributs) {
    for (const cle of Object.keys(attributs)) {
      const v = attributs[cle];
      if (v === null || v === undefined || v === false) continue;
      if (cle === "classe") noeud.className = v;
      else if (cle === "texte") noeud.textContent = String(v);
      else if (cle.startsWith("on") && typeof v === "function") noeud.addEventListener(cle.slice(2), v);
      else if (cle === "dataset") { for (const d of Object.keys(v)) noeud.dataset[d] = v[d]; }
      else noeud.setAttribute(cle, v === true ? "" : String(v));
    }
  }
  ajouterEnfants(noeud, enfants);
  return noeud;
}
function ajouterEnfants(noeud, enfants) {
  if (enfants === null || enfants === undefined || enfants === false) return;
  if (Array.isArray(enfants)) { for (const e of enfants) ajouterEnfants(noeud, e); return; }
  if (enfants instanceof Node) { noeud.appendChild(enfants); return; }
  noeud.appendChild(document.createTextNode(String(enfants)));
}
const SVG_NS = "http://www.w3.org/2000/svg";
function icone(nom, classe) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "icone" + (classe ? " " + classe : ""));
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  for (const d of (ICONES[nom] || [])) {
    const p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", d);
    svg.appendChild(p);
  }
  return svg;
}
function vider(noeud) { while (noeud && noeud.firstChild) noeud.removeChild(noeud.firstChild); }

/* Normalisation tolérante : espaces, majuscules, accents, ponctuation */
function normaliser(texte) {
  return String(texte == null ? "" : texte)
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[’‘`]/g, "'")
    .toLowerCase()
    .replace(/[\s  _\-·.:;,()]+/g, " ")
    .trim();
}
function correspond(texte, synonymes) {
  const t = normaliser(texte);
  if (!t) return false;
  return synonymes.some(s => normaliser(s) === t);
}

/* Lecture des nombres : 1 234,56 · 1,234.56 · (1 234) · 12 % · − 52 800 */
function lireNombre(v) {
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  if (typeof v === "boolean") return null;
  if (v instanceof Date) return null;
  if (typeof v !== "string") return null;
  let s = v.trim().replace(/[  \s]/g, "").replace(/[−–—]/g, "-");
  if (!s) return null;
  let negatif = false;
  if (/^\(.*\)$/.test(s)) { negatif = true; s = s.slice(1, -1); }
  let pourcent = false;
  if (s.endsWith("%")) { pourcent = true; s = s.slice(0, -1); }
  s = s.replace(/(DH|MAD|dhs?|j|jours|×|x|fois)$/i, "");
  const virgule = s.lastIndexOf(","), point = s.lastIndexOf(".");
  if (virgule >= 0 && point >= 0) {
    if (virgule > point) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (virgule >= 0) {
    s = /^-?\d{1,3}(,\d{3}){2,}$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
  } else if (point >= 0 && /^-?\d{1,3}(\.\d{3}){2,}$/.test(s)) {
    s = s.replace(/\./g, "");
  }
  if (!/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s)) return null;
  let n = Number(s);
  if (!Number.isFinite(n)) return null;
  if (pourcent) n = n / 100;
  if (negatif) n = -Math.abs(n);
  return n;
}
function lireTexte(v) {
  if (v === null || v === undefined) return "";
  if (v instanceof Date) return v.toLocaleDateString("fr-FR");
  return String(v);
}

/* Valeur d'une cellule SheetJS : erreurs (#N/A, #DIV/0!) traitées comme vides et comptées */
function valeurCellule(ws, adresse, compteur) {
  const c = ws[adresse];
  if (!c) return null;
  if (c.t === "e") { if (compteur) compteur.erreurs++; return null; }
  if (c.t === "z" || (c.f !== undefined && (c.v === undefined || c.v === null))) {
    if (c.f !== undefined && compteur) compteur.sansValeur++;
    return null;
  }
  if (c.v === undefined) return null;
  return c.v;
}

/* Construction d'une grille à coordonnées absolues (ligne 0 = ligne 1 d'Excel) */
function construireGrille(ws, compteur) {
  const ref = ws["!ref"];
  if (!ref) return [];
  const plage = XLSX.utils.decode_range(ref);
  const grille = [];
  for (let r = 0; r <= plage.e.r; r++) {
    const ligne = [];
    for (let c = 0; c <= plage.e.c; c++) {
      ligne.push(r < plage.s.r || c < plage.s.c ? null : valeurCellule(ws, XLSX.utils.encode_cell({ r, c }), compteur));
    }
    grille.push(ligne);
  }
  return grille;
}
const ligneVide = (ligne) => !ligne || ligne.every(v => v === null || v === "" || (typeof v === "string" && !v.trim()));

/* Recherche d'une ligne d'en-têtes contenant toutes les colonnes attendues */
function trouverTableau(grille, enTetes, options) {
  const obligatoires = (options && options.obligatoires) || Object.keys(enTetes);
  const debut = (options && options.debut) || 0;
  const fin = Math.min(grille.length, (options && options.limite) ? debut + options.limite : grille.length);
  for (let r = debut; r < fin; r++) {
    const ligne = grille[r] || [];
    const colonnes = Object.create(null);
    ligne.forEach((v, c) => {
      if (v === null || estColonneInterdite(v)) return;
      for (const cle of Object.keys(enTetes)) {
        if (colonnes[cle] === undefined && correspond(v, enTetes[cle])) { colonnes[cle] = c; break; }
      }
    });
    if (obligatoires.every(k => colonnes[k] !== undefined)) return { ligne: r, colonnes };
  }
  return null;
}
/* Les lignes d'un tableau jusqu'à la première ligne vide ; les lignes « Total » sont ignorées */
function lignesDuTableau(grille, tableau, colonneCle) {
  const res = [];
  for (let r = tableau.ligne + 1; r < grille.length; r++) {
    const ligne = grille[r];
    if (ligneVide(ligne)) { if (res.length) break; else continue; }
    const cle = ligne[tableau.colonnes[colonneCle]];
    if (cle === null || cle === "") continue;
    if (/^total\b/.test(normaliser(cle))) continue;
    res.push({ r, ligne });
  }
  return res;
}
function trouverTexte(grille, synonymes, debut) {
  for (let r = debut || 0; r < grille.length; r++) {
    const ligne = grille[r] || [];
    for (let c = 0; c < ligne.length; c++) {
      const v = ligne[c];
      if (typeof v === "string" && synonymes.some(s => normaliser(v).includes(normaliser(s)))) return { r, c };
    }
  }
  return null;
}

/* Correspondance des onglets, tolérante aux espaces, accents et majuscules */
function trouverOnglet(classeur, definition) {
  const cibles = [definition.nom, ...definition.synonymes].map(normaliser);
  return classeur.SheetNames.find(n => cibles.includes(normaliser(n))) || null;
}

/* Lecture des noms définis du classeur (Workbook.Names) */
function indexerNomsDefinis(classeur) {
  const index = new Map();
  const noms = (classeur.Workbook && classeur.Workbook.Names) || [];
  for (const n of noms) {
    if (!n || !n.Name || !n.Ref) continue;
    const cle = String(n.Name).trim().toUpperCase();
    if (!index.has(cle) || n.Sheet === undefined) index.set(cle, String(n.Ref));
  }
  return index;
}
function lireReference(classeur, ref) {
  const m = /^(?:'((?:[^']|'')+)'|([^!]+))!\$?([A-Z]{1,3})\$?(\d+)/.exec(ref.replace(/^=/, ""));
  if (!m) return { erreur: "reference" };
  const nomOnglet = (m[1] !== undefined ? m[1].replace(/''/g, "'") : m[2]).trim();
  const onglet = classeur.SheetNames.find(s => normaliser(s) === normaliser(nomOnglet));
  if (!onglet) return { erreur: "onglet", onglet: nomOnglet };
  const ws = classeur.Sheets[onglet];
  const adresse = m[3] + m[4];
  const c = ws[adresse];
  if (!c) return { valeur: null, onglet, adresse };
  if (c.t === "e") return { valeur: null, onglet, adresse, erreurCellule: true };
  if (c.f !== undefined && (c.v === undefined || c.v === null || c.t === "z")) return { valeur: null, onglet, adresse, sansValeur: true };
  if (c.t === "z") return { valeur: null, onglet, adresse };
  return { valeur: c.v === undefined ? null : c.v, onglet, adresse };

/* Lecture complète du classeur → modèle de données validé (ou ErreurLecture) */
function lireClasseur(octets, ext) {
  let classeur;
  const optionsLecture = { cellFormula: true, sheetStubs: true, cellDates: true, cellNF: false, cellHTML: false, cellStyles: false, bookVBA: false, bookDeps: false, sheetRows: FORMAT_ATTENDU.lignesMax + 1, WTF: false };
  try {
    if (ext === ".csv") {
      const texte = decoderTexte(octets);
      const premiere = texte.split(/\r?\n/, 1)[0] || "";
      const separateur = (premiere.match(/;/g) || []).length >= (premiere.match(/,/g) || []).length ? ";" : ",";
      classeur = XLSX.read(texte, Object.assign({ type: "string", FS: separateur }, optionsLecture));
    } else {
      classeur = XLSX.read(octets, Object.assign({ type: "array" }, optionsLecture));
    }
  } catch (e) {
    throw new ErreurLecture("Ce fichier n'est pas un classeur Excel lisible (fichier abîmé ou incomplet).", [], true);
  }
  if (!classeur || !Array.isArray(classeur.SheetNames) || classeur.SheetNames.length === 0) {
    throw new ErreurLecture("Ce fichier ne contient aucun onglet lisible.");
  }
  /* Limite du nombre de lignes */
  let totalLignes = 0;
  for (const n of classeur.SheetNames) {
    const ws = classeur.Sheets[n];
    const ref = ws && (ws["!fullref"] || ws["!ref"]);
    if (!ref) continue;
    const p = XLSX.utils.decode_range(ref);
    const lignes = p.e.r - p.s.r + 1;
    totalLignes += lignes;
    if (lignes > FORMAT_ATTENDU.lignesMax || totalLignes > FORMAT_ATTENDU.lignesMax) {
      throw new ErreurLecture("Fichier refusé : plus de 50 000 lignes.");
    }
  }
  return extraireModele(classeur);
}

/* Décodage CSV : UTF-8 d'abord, sinon Windows-1252 (accents corrects) */
function decoderTexte(octets) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(octets).replace(/^﻿/, ""); }
  catch (e) { return new TextDecoder("windows-1252").decode(octets); }
}

function extraireModele(classeur) {
  const erreurs = [];
  const avertissements = [];
  const compteur = { erreurs: 0, sansValeur: 0 };
  const F = FORMAT_ATTENDU;

  /* 1) Onglets */
  const onglets = Object.create(null);
  for (const cle of Object.keys(F.onglets)) {
    const def = F.onglets[cle];
    onglets[cle] = trouverOnglet(classeur, def);
    if (!onglets[cle] && def.obligatoire) erreurs.push("Onglet manquant : « " + def.nom + " ».");
  }
  if (erreurs.length) throw new ErreurLecture("Le fichier ne respecte pas le format attendu.", erreurs);
  const grilles = Object.create(null);
  for (const cle of Object.keys(onglets)) if (onglets[cle]) grilles[cle] = construireGrille(classeur.Sheets[onglets[cle]], compteur);

  /* 2) Noms définis */
  const index = indexerNomsDefinis(classeur);
  const noms = Object.create(null);
  const sansValeur = [];
  for (const def of F.nomsDefinis) {
    const ref = index.get(def.nom);
    if (!ref) { erreurs.push("Nom défini manquant : « " + def.nom + " » (onglet " + def.onglet + ")."); continue; }
    if (/#REF!/i.test(ref)) { erreurs.push("Le nom défini « " + def.nom + " » (onglet " + def.onglet + ") pointe vers une cellule supprimée (#REF!)."); continue; }
    const lu = lireReference(classeur, ref);
    if (lu.erreur === "onglet") { erreurs.push("Le nom défini « " + def.nom + " » pointe vers un onglet introuvable (« " + lu.onglet + " »)."); continue; }
    if (lu.erreur) { erreurs.push("Le nom défini « " + def.nom + " » (onglet " + def.onglet + ") n'a pas une référence de cellule simple."); continue; }
    if (lu.sansValeur) { sansValeur.push(def.nom); continue; }
    if (lu.erreurCellule) { compteur.erreurs++; erreurs.push("La cellule du nom défini « " + def.nom + " » (onglet " + def.onglet + ") est en erreur (#N/A, #DIV/0!…)."); continue; }
    if (def.type === "nombre") {
      const n = lireNombre(lu.valeur);
      if (n === null) {
        if (/^KPI_/.test(def.nom) && typeof lu.valeur === "string" && lu.valeur.trim()) noms[def.nom] = lu.valeur.trim();
        else erreurs.push("Le nom défini « " + def.nom + " » (onglet " + def.onglet + ") ne contient pas un nombre.");
        continue;
      }
      noms[def.nom] = n;
    } else {
      noms[def.nom] = lireTexte(lu.valeur).trim();
    }

  if (sansValeur.length) {
    throw new ErreurLecture("Ouvrez le fichier dans Excel et enregistrez-le pour calculer les formules.",
      ["Formules sans valeur enregistrée : " + sansValeur.slice(0, 6).join(", ") + (sansValeur.length > 6 ? " et " + (sansValeur.length - 6) + " autres" : "") + "."]);
  }

  /* 3) Onglet TFT : lignes O1 à T1 par leur code */
  const gTft = grilles.tft;
  const tabTft = trouverTableau(gTft, F.tft.enTetes, { obligatoires: ["code", "libelle", "n", "n1"], limite: 10 });
  const tft = { lignes: [], parCode: Object.create(null) };
  if (!tabTft) {
    erreurs.push("Onglet TFT : ligne d'en-têtes introuvable dans les 10 premières lignes (Ligne, Libellé, 2027, 2026).");
  } else {
    const col = tabTft.colonnes;
    const attendus = new Set(F.tft.codes);
    let fini = false;
    for (let r = tabTft.ligne + 1; r < gTft.length && !fini; r++) {
      const ligne = gTft[r];
      if (ligneVide(ligne)) continue;
      const codeBrut = ligne[col.code];
      const code = codeBrut === null ? "" : String(codeBrut).trim().toUpperCase();
      const libelleBrut = lireTexte(ligne[col.libelle]);
      const libelle = libelleBrut.trim();
      if (code && attendus.has(code) && !tft.parCode[code]) {
        const v27 = lireNombre(ligne[col.n]);
        const v26 = lireNombre(ligne[col.n1]);
        const niveau = F.tft.totaux.includes(code) ? "total" : F.tft.sousTotaux.includes(code) ? "sous-total" : "detail";
        const enreg = { code, libelle, retrait: /^\s{2,}/.test(libelleBrut), niveau, n: v27 === null ? 0 : v27, n1: v26 === null ? 0 : v26, note: col.note !== undefined ? lireTexte(ligne[col.note]).trim() : "" };
        tft.parCode[code] = enreg;
        tft.lignes.push(enreg);
        if (code === F.tft.dernierCode) fini = true;
      } else if (!code && libelle && !tft.parCode[F.tft.dernierCode]) {
        const estSection = libelle === libelle.toUpperCase() && /[A-Z]/.test(libelle);
        tft.lignes.push({ code: "", libelle, niveau: estSection ? "section" : "sous-section" });
      }
    }
    const manquants = F.tft.codes.filter(c => !tft.parCode[c]);
    for (const c of manquants) erreurs.push("Code de ligne manquant : « " + c + " » en colonne B de l'onglet TFT.");
  }

  /* 4) Onglet KPI : K01 à K14, dictionnaire, seuils, graphiques, recommandations */
  const gKpi = grilles.kpi;
  const tabKpi = trouverTableau(gKpi, F.kpi.enTetes, { obligatoires: ["code", "libelle", "feuN", "feuN1"], limite: 10 });
  const kpis = [];
  const parCodeKpi = Object.create(null);
  if (!tabKpi) {
    erreurs.push("Onglet KPI : tableau des KPI introuvable dans les 10 premières lignes (N°, KPI, 2027, 2026, Feu 2027, Feu 2026).");
  } else {
    const col = tabKpi.colonnes;
    for (const { ligne } of lignesDuTableau(gKpi, tabKpi, "code")) {
      const code = String(ligne[col.code]).trim().toUpperCase();
      if (!F.kpi.codes.includes(code) || parCodeKpi[code]) continue;
      const nomBase = "KPI_" + F.kpi.noms[code];
      const k = {
        code,
        libelle: lireTexte(ligne[col.libelle]).trim(),
        n: noms[nomBase + "_2027"],
        n1: noms[nomBase + "_2026"],
        variation: col.variation !== undefined ? lireNombre(ligne[col.variation]) : null,
        feuN: normaliserFeu(ligne[col.feuN]),
        feuN1: normaliserFeu(ligne[col.feuN1]),
        nomDefini: nomBase + "_2027",
        definition: "", unite: "", seuilVert: "", seuilOrange: "", seuilRouge: "", pourquoi: "", sens: "", seuilVertNombre: null, seuilOrangeNombre: null
      };
      if (k.variation === null && typeof k.n === "number" && typeof k.n1 === "number") k.variation = k.n - k.n1;
      kpis.push(k);
      parCodeKpi[code] = k;
    }
    for (const c of F.kpi.codes) if (!parCodeKpi[c]) erreurs.push("Code de ligne manquant : « " + c + " » en colonne B de l'onglet KPI.");
  }
  const kpiVisible = (c) => parCodeKpi[c];

  const tabDico = gKpi ? trouverTableau(gKpi, F.dictionnaire.enTetes, { obligatoires: ["code", "definition", "unite"] }) : null;
  if (!tabDico) avertissements.push("Onglet KPI : dictionnaire des KPI introuvable (colonnes N°, Définition, Unité).");
  else {
    const col = tabDico.colonnes;
    for (const { ligne } of lignesDuTableau(gKpi, tabDico, "code")) {
      const k = kpiVisible(String(ligne[col.code]).trim().toUpperCase());
      if (!k) continue;
      k.definition = lireTexte(ligne[col.definition]).trim();
      k.unite = lireTexte(ligne[col.unite]).trim();
      k.seuilVert = col.vert !== undefined ? lireTexte(ligne[col.vert]).trim() : "";
      k.seuilOrange = col.orange !== undefined ? lireTexte(ligne[col.orange]).trim() : "";
      k.seuilRouge = col.rouge !== undefined ? lireTexte(ligne[col.rouge]).trim() : "";
      k.pourquoi = col.pourquoi !== undefined ? lireTexte(ligne[col.pourquoi]).trim() : "";
    }
  }
  const tabSeuils = gKpi ? trouverTableau(gKpi, F.seuils.enTetes, { obligatoires: ["code", "sens", "vert"] }) : null;
  if (tabSeuils) {
    const col = tabSeuils.colonnes;
    for (const { ligne } of lignesDuTableau(gKpi, tabSeuils, "code")) {
      const k = kpiVisible(String(ligne[col.code]).trim().toUpperCase());
      if (!k) continue;
      k.sens = lireTexte(ligne[col.sens]).trim();
      k.seuilVertNombre = lireNombre(ligne[col.vert]);
      k.seuilOrangeNombre = col.orange !== undefined ? lireNombre(ligne[col.orange]) : null;
    }
  }

  const radar = lireSection(gKpi, F.radar.enTetes, "axe", avertissements, "Radar", (l, c) => ({
    axe: lireTexte(l[c.axe]).trim(), n: lireNombre(l[c.n]), n1: lireNombre(l[c.n1]), cible: lireNombre(l[c.cible]),
    scoreN: lireNombre(l[c.scoreN]), scoreN1: lireNombre(l[c.scoreN1]), sens: c.sens !== undefined ? lireTexte(l[c.sens]).trim() : ""
  }));
  const entonnoir = lireSection(gKpi, F.entonnoir.enTetes, "etape", avertissements, "Entonnoir", (l, c) => ({
    etape: libelleCourt(lireTexte(l[c.etape])), valeur: lireNombre(l[c.valeur])
  }));
  const cascade = lireSection(gKpi, F.cascade.enTetes, "barre", avertissements, "Cascade", (l, c) => ({
    barre: libelleCourt(lireTexte(l[c.barre])), debut: lireNombre(l[c.debut]), fin: lireNombre(l[c.fin])
  }));
  const jauges = lireSection(gKpi, F.jauges.enTetes, "jauge", avertissements, "Jauge", (l, c) => {
    const repere = lireTexte(l[c.repere]).trim();
    const m = /(-?\d+(?:[.,]\d+)?)\s*$/.exec(repere);
    return { nom: lireTexte(l[c.jauge]).trim(), valeur: lireNombre(l[c.valeur]), maximum: lireNombre(l[c.maximum]),
      repere: m ? lireNombre(m[1]) : null, repereMot: m ? repere.slice(0, m.index).trim() : repere };
  });
  const bullet = lireSection(gKpi, F.bullet.enTetes, "poste", avertissements, "Poste du cycle de cash", (l, c) => ({
    poste: lireTexte(l[c.poste]).trim(), valeur: lireNombre(l[c.valeur]), seuil: lireNombre(l[c.seuil])
  }));

  /* Recommandations au DG (section 5), recopiées mot pour mot */
  const recos = [];
  let noteRecos = "";
  if (gKpi) {
    const tabBullet = trouverTableau(gKpi, F.bullet.enTetes);
    const repere = trouverTexte(gKpi, F.recos.reperes, tabBullet ? Math.max(0, tabBullet.ligne - 3) : 0);
    if (repere) {
      for (let r = repere.r + 1; r < gKpi.length && recos.length < 3; r++) {
        for (const v of (gKpi[r] || [])) {
          if (typeof v === "string" && /^\s*[1-9]\.\s+\S/.test(v)) { recos.push(v.trim().replace(/^[1-9]\.\s+/, "")); break; }
        }
      }
      const note = trouverTexte(gKpi, F.recos.note, repere.r);
      if (note) noteRecos = lireTexte(gKpi[note.r][note.c]).trim();
    }
  }

  /* 5) LISEZ-MOI : le message principal ; DASHBOARD : le titre */
  let message = "";
  const gLm = grilles.lisezMoi;
  const repMsg = gLm ? trouverTexte(gLm, F.lisezMoi.message) : null;
  if (repMsg) {
    for (let r = repMsg.r + 1; r < Math.min(gLm.length, repMsg.r + 4) && !message; r++) {
      for (const v of (gLm[r] || [])) if (typeof v === "string" && v.trim().length > 20) { message = v.trim(); break; }

  const titre = premierTexte(grilles.dashboard) || premierTexte(gKpi) || premierTexte(gTft) || "Situation TFT 2027";
  const titreTft = premierTexte(gTft);

  /* 6) CONTROLES : statut global et nombre de contrôles */
  const gCtl = grilles.controles;
  const total = lireValeurAdroite(gCtl, F.controles.total);
  const conformes = lireValeurAdroite(gCtl, F.controles.conformes);
  const controles = { statut: noms.STATUT_GLOBAL || "", total: total, conformes: conformes, enEcart: (total !== null && conformes !== null) ? Math.max(0, total - conformes) : null };
  const tabCtl = gCtl ? trouverTableau(gCtl, { code: ["N°"], controle: ["Contrôle"], statut: ["Statut"], fichier: ["Fichier"] }) : null;
  if (tabCtl) {
    const lignesCtl = lignesDuTableau(gCtl, tabCtl, "code");
    const ecartsTable = lignesCtl.filter(({ ligne }) => normaliser(ligne[tabCtl.colonnes.statut]) !== "conforme").length;
    if (controles.total === null) controles.total = lignesCtl.length;
    if (controles.enEcart === null || ecartsTable > controles.enEcart) controles.enEcart = ecartsTable;
  }

  const bilan = lireBilanIfrs(grilles.retraitementsIfrs);

  if (compteur.sansValeur > 0) avertissements.push(compteur.sansValeur + " formule(s) sans valeur enregistrée : ouvrez le fichier dans Excel et enregistrez-le pour calculer les formules.");
  if (compteur.erreurs > 0) avertissements.push(compteur.erreurs + " cellule(s) en erreur (#N/A, #DIV/0!…) ont été traitées comme vides.");
  if (erreurs.length) throw new ErreurLecture("Le fichier ne respecte pas le format attendu.", erreurs);

  return {
    titre, titreTft, message, tft,
    totaux: lireTotaux(noms),
    kpis, params: lireParams(noms), radar, entonnoir, cascade, jauges, bullet, recos, noteRecos, controles, bilan,
    avertissements
  };
}

function normaliserFeu(v) {
  const t = normaliser(v);

  if (t === "ambre" || t === "orange" || t === "amber") return "AMBRE";

}
function libelleCourt(texte) { return String(texte || "").split(" · ")[0].trim(); }
function premierTexte(grille) {
  if (!grille) return "";
  for (let r = 0; r < Math.min(grille.length, 4); r++) for (const v of (grille[r] || [])) if (typeof v === "string" && v.trim().length > 8) return v.trim();
  return "";
}
function lireValeurAdroite(grille, synonymes) {
  if (!grille) return null;

  if (!pos) return null;
  const ligne = grille[pos.r];
  for (let c = pos.c + 1; c < ligne.length; c++) { const n = lireNombre(ligne[c]); if (n !== null) return n; }
  return null;
}
function lireSection(grille, enTetes, cle, avertissements, nomSection, transformer) {
  if (!grille) return [];
  const tab = trouverTableau(grille, enTetes);
  if (!tab) { avertissements.push("Onglet KPI, section 4 ou 5 : tableau « " + nomSection + " » introuvable ; le graphique correspondant est masqué."); return []; }
  return lignesDuTableau(grille, tab, cle).map(({ ligne }) => transformer(ligne, tab.colonnes));
}
function lireTotaux(noms) {
  const t = Object.create(null);
  for (const c of ["OT", "IT", "FT", "V", "T0", "T1"]) t[c] = { n: noms["TFT_" + c + "_2027"], n1: noms["TFT_" + c + "_2026"] };
  return t;
}
function lireParams(noms) {
  const p = Object.create(null);
  for (const k of Object.keys(noms)) if (k.startsWith("PARAM_")) p[k.slice(6)] = noms[k];
  return p;
}
function lireBilanIfrs(grille) {
  if (!grille) return null;
  const B = FORMAT_ATTENDU.bilan;
  const res = Object.create(null);
  const lireCode = (code, entetesN, entetesN1) => {
    for (let r = 0; r < grille.length; r++) {
      const v = grille[r] && grille[r][1];
      if (v === null || String(v).trim().toUpperCase() !== code) continue;
      for (let h = r - 1; h >= 0; h--) {
        const ligne = grille[h] || [];
        const cN = ligne.findIndex(x => correspond(x, entetesN));
        const cN1 = ligne.findIndex(x => correspond(x, entetesN1));
        if (cN >= 0 && cN1 >= 0) return { n: lireNombre(grille[r][cN]), n1: lireNombre(grille[r][cN1]) };
      }
    }
    return null;
  };
  for (const c of B.codesBilan) res[c] = lireCode(c, B.enTeteN, B.enTeteN1);
  for (const c of B.codesResultat) res[c] = lireCode(c, ["2027"], ["2026"]);

function lireReglageSynchro() {

}

/* IndexedDB : on garde la poignée du fichier, jamais son contenu */
function ouvrirIdb() {

    if (!("indexedDB" in window)) { rejeter(new Error("idb")); return; }
    let req;
    try { req = indexedDB.open(REGLAGES.baseIdb, 1); } catch (e) { rejeter(e); return; }
    req.onupgradeneeded = () => { req.result.createObjectStore(REGLAGES.magasinIdb); };
    req.onsuccess = () => resoudre(req.result);
    req.onerror = () => rejeter(req.error);
  });
}
async function idb(action, valeur) {
  try {
    const db = await ouvrirIdb();
    return await new Promise((resoudre, rejeter) => {
      const tx = db.transaction(REGLAGES.magasinIdb, action === "lire" ? "readonly" : "readwrite");
      const st = tx.objectStore(REGLAGES.magasinIdb);
      const req = action === "lire" ? st.get(REGLAGES.clePoignee) : action === "ecrire" ? st.put(valeur, REGLAGES.clePoignee) : st.delete(REGLAGES.clePoignee);
      req.onsuccess = () => resoudre(req.result);
      req.onerror = () => rejeter(req.error);
      tx.oncomplete = () => db.close();
    });
  } catch (e) { return null; }
}

const attendre = (ms) => new Promise(r => setTimeout(r, ms));

function changerEtat(statut, raison) {
  Sync.statut = statut;
  Sync.raison = raison || "";
  dessinerPanneauxSync();
}

function planifier() {
  clearTimeout(Sync.minuteur);
  Sync.minuteur = null;
  if (!Sync.actif || !Sync.mode || Sync.mode === "import") return;
  const delai = Sync.mode === "direct" ? REGLAGES.intervalleDirect : (estLocal ? REGLAGES.intervalleLocal : REGLAGES.intervalleEnLigne);
  Sync.minuteur = setTimeout(verifier, delai);
}

async function verifier() {
  clearTimeout(Sync.minuteur);
  if (!Sync.actif) { if (Etat.modele) changerEtat("pause"); return; }
  if (Sync.enCours) { Sync.relance = true; return; }
  Sync.enCours = true;
  try {
    if (Sync.mode === "direct") await verifierDirect();
    else if (Sync.mode === "en-ligne") await verifierEnLigne(false);
  } catch (e) {
    /* tout est déjà traité dans les fonctions appelées */
  } finally {
    Sync.enCours = false;
    if (Sync.relance) { Sync.relance = false; setTimeout(verifier, 0); }
    else planifier();
  }
}

/* Mode A · Direct : relit le fichier toutes les 2 s (getFile), compare date et taille */
async function verifierDirect() {
  const p = Sync.poignee;
  if (!p) return;
  try {
    const perm = await p.queryPermission({ mode: "read" });
    if (perm !== "granted") { changerEtat("reconnexion", "Autorisation à renouveler pour « " + p.name + " »."); return; }
    let f = await obtenirAvecPatience(() => p.getFile());
    const sig = { lm: f.lastModified, taille: f.size };
    if (Sync.signature && sig.lm === Sync.signature.lm && sig.taille === Sync.signature.taille) {
      if (Sync.statut !== "ok" && Sync.statut !== "erreur" && Etat.modele) changerEtat("ok");
      return;
    }
    changerEtat("lecture");
    /* Excel enregistre : on attend 700 ms et on ne traite que si date et taille sont stables */
    if (Sync.signature) {
      for (let i = 0; i < 12; i++) {
        await attendre(REGLAGES.attenteStabilite);
        const g = await obtenirAvecPatience(() => p.getFile());
        const stable = g.lastModified === f.lastModified && g.size === f.size;
        f = g;
        if (stable) break;
      }
    }
    for (let essai = 0; essai <= REGLAGES.essaisLecture; essai++) {
      const octets = await lireAvecEssais(() => p.getFile());
      if (!octets) return;
      const r = await traiterOctets(octets.donnees, octets.fichier.name, octets.fichier.size, { lm: octets.fichier.lastModified, taille: octets.fichier.size }, { essai: essai < REGLAGES.essaisLecture });
      if (r !== "reessayer") return;
      await attendre(REGLAGES.delaiEssais);
    }
  } catch (e) {
    gererErreurAcces(e);
  }
}

/* Pendant qu'Excel remplace le fichier, il peut disparaître un instant : 3 essais en 1 seconde */
async function obtenirAvecPatience(obtenir) {
  for (let essai = 0; ; essai++) {
    try { return await obtenir(); }
    catch (e) {
      if (essai >= REGLAGES.essaisLecture || !(e && (e.name === "NotFoundError" || e.name === "NotReadableError"))) throw e;
      await attendre(REGLAGES.delaiEssais);
    }
  }
}

/* Fichier illisible pendant l'enregistrement : 3 nouveaux essais en 1 seconde */
async function lireAvecEssais(obtenirFichier) {
  let derniere = null;
  for (let essai = 0; essai <= REGLAGES.essaisLecture; essai++) {
    try {
      const fichier = await obtenirFichier();
      controlerFichierAvantLecture(fichier.name, fichier.size);
      const donnees = new Uint8Array(await fichier.arrayBuffer());
      return { fichier, donnees };
    } catch (e) {
      derniere = e;
      const reessayable = (e && (e.name === "NotReadableError" || e.name === "NotFoundError" || (e instanceof ErreurLecture && e.reessayable)));
      if (!reessayable) throw e;
      await attendre(REGLAGES.delaiEssais);
    }
  }
  if (derniere && derniere.name === "NotFoundError") throw derniere;
  changerEtat("erreur", derniere instanceof ErreurLecture ? derniere.message : "Le fichier est verrouillé ou en cours d'enregistrement.");
  return null;
}

function gererErreurAcces(e) {
  const nom = e && e.name;
  if (e instanceof ErreurLecture) { changerEtat("erreur", e.message); afficherAlerte(e); return; }
  if (nom === "NotFoundError") changerEtat("reconnexion", "Le fichier a été déplacé, renommé ou supprimé.");
  else if (nom === "NotAllowedError" || nom === "SecurityError") changerEtat("reconnexion", "L'autorisation de lecture a été retirée.");
  else if (nom === "NotReadableError") changerEtat("erreur", "Le fichier est verrouillé ou en cours d'enregistrement.");
  else changerEtat("reconnexion", "Le fichier n'est plus accessible (ordinateur sorti de veille ou fichier déplacé).");
}

/* Mode B · En ligne : relit donnees.xlsx à côté d'index.html */
async function verifierEnLigne(premier) {
  let reponse;
  try {
    reponse = await fetch(FORMAT_ATTENDU.fichierEnLigne, { cache: "no-cache", credentials: "same-origin", redirect: "follow" });
  } catch (e) {
    if (premier) return false;
    changerEtat("reconnexion", "Le fichier en ligne est injoignable pour le moment.");
    return false;
  }
  if (!reponse.ok) {
    if (premier) return false;
    changerEtat("reconnexion", "Le fichier en ligne « " + FORMAT_ATTENDU.fichierEnLigne + " » est introuvable.");
    return false;
  }
  const longueur = Number(reponse.headers.get("content-length") || 0);
  if (longueur > FORMAT_ATTENDU.tailleMaxOctets) {
    changerEtat("erreur", "Fichier trop volumineux : la limite est de 10 Mo.");
    return false;
  }
  const donnees = new Uint8Array(await reponse.arrayBuffer());
  const sig = await empreinteOctets(donnees);
  if (Sync.signature && Sync.signature === sig) {
    if (Sync.statut !== "ok" && Sync.statut !== "erreur" && Etat.modele) changerEtat("ok");
    return true;
  }
  if (Etat.modele) changerEtat("lecture");
  Sync.nomFichier = FORMAT_ATTENDU.fichierEnLigne;
  await traiterOctets(donnees, FORMAT_ATTENDU.fichierEnLigne, donnees.length, sig);
  return true;
}

/* Traitement commun : sécurité → lecture → validation → empreinte → affichage */
async function traiterOctets(donnees, nom, taille, signature, options) {
  try {
    const ext = controlerFichierAvantLecture(nom, taille);
    controlerSignature(ext, donnees);
    const modele = lireClasseur(donnees, ext);
    const empreinte = await calculerEmpreinte(modele);
    Sync.signature = signature;
    Sync.nomFichier = nom;
    effacerAlerte();
    if (empreinte !== Etat.empreinte) {
      appliquerModele(modele, empreinte);
      Sync.derniereMaj = new Date();
    } else if (!Sync.derniereMaj) {
      Sync.derniereMaj = new Date();
    }
    changerEtat(Sync.actif || Sync.mode === "import" ? "ok" : "pause");
    if (modele.avertissements.length) afficherAlerte(new ErreurLecture("Le fichier est lu, avec quelques remarques.", modele.avertissements), true);
    return true;
  } catch (e) {
    if (e instanceof ErreurLecture && e.reessayable && options && options.essai) return "reessayer";
    Sync.signature = signature;
    const err = e instanceof ErreurLecture ? e : new ErreurLecture(messageUtilisateur(e));
    changerEtat("erreur", err.message);
    afficherAlerte(err);
    if (!Etat.modele) { Etat.erreurInitiale = err; dessinerPage(); }
    return false;
  }
}

/* Empreinte SHA-256 des données lues (Web Crypto) : on ne redessine que si elle change */
async function empreinteOctets(octets) {
  try {
    if (window.crypto && crypto.subtle) {
      const h = await crypto.subtle.digest("SHA-256", octets);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { /* repli ci-dessous */ }
  let h = 0x811c9dc5;
  for (let i = 0; i < octets.length; i++) { h ^= octets[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  return "fnv-" + h.toString(16) + "-" + octets.length;
}
async function calculerEmpreinte(modele) {
  const texte = JSON.stringify(modele);
  try {
    if (window.crypto && crypto.subtle) {
      const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texte));
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { /* repli ci-dessous */ }
  let h = 0x811c9dc5;
  for (let i = 0; i < texte.length; i++) { h ^= texte.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return "fnv-" + h.toString(16);
}

/* Actions de l'utilisateur */
async function connecterFichier() {

async function brancherPoignee(poignee) {

  await idb("ecrire", poignee);

}
async function reconnecter() {
  if (Sync.mode === "en-ligne" && !Sync.poignee) { Sync.signature = null; verifier(); return; }
  const p = Sync.poignee;
  if (!p) { connecterFichier(); return; }
  try {
    const perm = await p.requestPermission({ mode: "read" });
    if (perm !== "granted") { changerEtat("reconnexion", "Autorisation refusée : cliquez à nouveau sur « Reconnecter »."); return; }
    await p.getFile();
    Sync.mode = "direct";
    Sync.signature = null;
    if (!Sync.actif) { Sync.actif = true; ecrireReglageSynchro(true); }
    verifier();
  } catch (e) {
    if (e && e.name === "NotFoundError") { await idb("effacer"); Sync.poignee = null; connecterFichier(); }
    else gererErreurAcces(e);
  }
}
function ouvrirImport() {
  const entree = document.getElementById("entree-fichier");

}
async function importerFichier(fichier) {

    if (!Etat.modele) { Etat.erreurInitiale = err; dessinerPage(); }

}
function basculerSynchro() {
  Sync.actif = !Sync.actif;
  ecrireReglageSynchro(Sync.actif);
  if (Sync.actif) {
    afficherToast("Synchronisation activée : vérification immédiate.");

/* Fichier glissé dans la page : connecté en direct si le navigateur le permet */
function installerDepot() {
  const voile = document.getElementById("depot-global");
  let profondeur = 0;
  window.addEventListener("dragenter", (e) => { if (aDesFichiers(e)) { profondeur++; voile.classList.add("visible"); e.preventDefault(); } });
  window.addEventListener("dragover", (e) => { if (aDesFichiers(e)) e.preventDefault(); });
  window.addEventListener("dragleave", () => { profondeur = Math.max(0, profondeur - 1); if (!profondeur) voile.classList.remove("visible"); });
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    profondeur = 0; voile.classList.remove("visible");
    const item = e.dataTransfer && e.dataTransfer.items && e.dataTransfer.items[0];
    if (item && item.kind === "file" && typeof item.getAsFileSystemHandle === "function") {
      const fichierRepli = item.getAsFile();
      try {
        const poignee = await item.getAsFileSystemHandle();
        if (poignee && poignee.kind === "file") {
          controlerFichierAvantLecture(poignee.name, 1);
          await brancherPoignee(poignee);
          return;
        }
      } catch (err) {
        if (err instanceof ErreurLecture) { changerEtat("erreur", err.message); afficherAlerte(err); return; }
      }
      importerFichier(fichierRepli);
      return;
    }
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) importerFichier(f);
  });
}
const aDesFichiers = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");

/* =====================================================================
   5. CALCULS · chaque calcul est une fonction séparée, simple à vérifier
   ===================================================================== */
const Calculs = Object.freeze({
  ebitda: (resultatOperationnel, dotations, depreciations) => resultatOperationnel + dotations + depreciations,
  conversionCash: (ot, ebitda) => ot / ebitda,
  otSurResultatNet: (ot, resultatNet) => ot / resultatNet,
  freeCashFlow: (ot, i1, i2) => ot + i1 + i2,
  freeCashFlowApresLoyers: (fcf, f4, f5) => fcf + f4 + f5,
  investissementsSurAmortissements: (i1, i2, dotations) => dotations ? -(i1 + i2) / dotations : 0,
  delaiClients: (clients, chiffreAffaires, tva, jours) => clients / (chiffreAffaires * (1 + tva)) * jours,
  delaiStocks: (stocks, achatsConsommes, jours) => stocks / achatsConsommes * jours,
  delaiFournisseurs: (fournisseurs, achatsConsommes, tva, jours) => fournisseurs / (achatsConsommes * (1 + tva)) * jours,
  cycleCash: (dso, dio, dpo) => dso + dio - dpo,
  detteNette: (emprunts, detteLocation, tresorerieNette) => emprunts + detteLocation - tresorerieNette,
  levier: (detteNette, ebitda) => detteNette / ebitda,
  levierHorsIfrs16: (detteNette, detteLocation, ebitda, f4, f5) => (detteNette - detteLocation) / (ebitda + f4 + f5),
  couvertureDette: (ot, f2, f3, f4, f5) => ot / -(f2 + f3 + f4 + f5),
  couvertureDividendes: (fcf, f6) => fcf / -f6
});

/* Recalcul indépendant des 14 KPI à partir du TFT et des bilans IFRS */
function recalculerKpi(modele) {
  const t = modele.tft.parCode, b = modele.bilan, p = modele.params;
  if (!b || !t.O1) return null;
  const res = Object.create(null);
  for (const a of ["n", "n1"]) {
    const v = (c) => t[c] ? t[c][a] : 0;
    const e = Calculs.ebitda(v("O1"), v("O2"), v("O3"));
    const fcf = Calculs.freeCashFlow(v("OT"), v("I1"), v("I2"));
    const dso = Calculs.delaiClients(b.A8[a], b.CA[a], p.TVA, p.JOURS);
    const dio = Calculs.delaiStocks(b.A7[a], b.AC[a], p.JOURS);
    const dpo = Calculs.delaiFournisseurs(b.L6[a], b.AC[a], p.TVA, p.JOURS);
    const dn = Calculs.detteNette(b.L2[a], b.L3[a], v("T1"));
    const valeurs = {
      K01: Calculs.conversionCash(v("OT"), e), K02: Calculs.otSurResultatNet(v("OT"), b.RN[a]),
      K03: fcf, K04: Calculs.freeCashFlowApresLoyers(fcf, v("F4"), v("F5")),
      K05: Calculs.investissementsSurAmortissements(v("I1"), v("I2"), v("O2")),
      K06: dso, K07: dio, K08: dpo, K09: Calculs.cycleCash(dso, dio, dpo),
      K10: dn, K11: Calculs.levier(dn, e), K12: Calculs.levierHorsIfrs16(dn, b.L3[a], e, v("F4"), v("F5")),
      K13: Calculs.couvertureDette(v("OT"), v("F2"), v("F3"), v("F4"), v("F5")),
      K14: Calculs.couvertureDividendes(fcf, v("F6"))
    };
    for (const c of Object.keys(valeurs)) { res[c] = res[c] || {}; res[c][a] = valeurs[c]; }
  }
  return res;
}
function comparerRecalcul(modele) {
  const calc = recalculerKpi(modele);
  if (!calc) return { disponible: false, ecarts: [], egaux: 0, total: 0 };
  const ecarts = [];
  let egaux = 0, total = 0;
  for (const k of modele.kpis) {
    for (const a of ["n", "n1"]) {
      if (typeof k[a] !== "number" || !calc[k.code]) continue;
      total++;
      const diff = Math.abs(k[a] - calc[k.code][a]);
      if (diff <= 1e-6 * Math.max(1, Math.abs(k[a]))) egaux++;
      else ecarts.push({ code: k.code, annee: a === "n" ? 2027 : 2026, fichier: k[a], calcul: calc[k.code][a] });
    }
  }
  return { disponible: true, ecarts, egaux, total, valeurs: calc };
}

/* Feu d'une famille : le plus sévère de ses KPI */
function feuFamille(famille, modele) {
  const ordre = { "ROUGE": 3, "AMBRE": 2, "VERT": 1, "–": 0 };
  let pire = "–";
  for (const c of famille.codes) {
    const k = modele.kpis.find(x => x.code === c);
    if (k && ordre[k.feuN] > ordre[pire]) pire = k.feuN;
  }
  return pire;
}

/* Différences entre deux versions des données (pour le résumé du changement) */
function aplatir(objet, prefixe, sortie) {
  sortie = sortie || new Map();
  if (objet === null || typeof objet !== "object") { sortie.set(prefixe, objet); return sortie; }
  for (const cle of Object.keys(objet)) {
    if (cle === "avertissements" || cle === "lignes") continue;
    aplatir(objet[cle], prefixe ? prefixe + "." + cle : cle, sortie);
  }
  return sortie;
}
function compterDifferences(ancien, nouveau) {
  const a = aplatir(ancien), n = aplatir(nouveau);
  let nb = 0;
  const cles = new Set([...a.keys(), ...n.keys()]);
  for (const c of cles) if (a.get(c) !== n.get(c)) nb++;
  return nb;
}
function kpiModifies(ancien, nouveau) {
  const res = new Set();
  if (!ancien) return res;
  for (const k of nouveau.kpis) {
    const v = ancien.kpis.find(x => x.code === k.code);
    if (!v || v.n !== k.n || v.n1 !== k.n1 || v.feuN !== k.feuN || v.feuN1 !== k.feuN1) res.add(k.code);
  }
  for (const c of Object.keys(nouveau.totaux)) {
    const v = ancien.totaux[c], k = nouveau.totaux[c];
    if (!v || v.n !== k.n || v.n1 !== k.n1) res.add(c);
  }
  return res;
}

/* Points d'attention générés si les recommandations manquent (règles simples, aucun appel réseau) */
function genererPointsAttention(m) {
  const k = (c) => m.kpis.find(x => x.code === c) || {};
  const p = m.params;
  const pts = [];
  const fcf = k("K03").n, lev = k("K11").n, div = k("K14").n, ccc = k("K09").n, dscr = k("K13").n;
  if (typeof fcf === "number") pts.push(fcf < 0
    ? "Le free cash-flow 2027 est de " + formaterValeur(fcf, "DH") + " : les investissements dépassent le cash dégagé par l'exploitation. Financer les investissements par un crédit à moyen terme plutôt que par le découvert."
    : "Le free cash-flow 2027 est de " + formaterValeur(fcf, "DH") + " : l'exploitation finance les investissements.");
  if (typeof lev === "number") pts.push(lev > p.PLAFOND
    ? "La dette nette vaut " + formaterValeur(lev, "fois") + " l'EBITDA, au-dessus du plafond bancaire de " + formaterNombre(p.PLAFOND, 2) + " : prioriser le désendettement."
    : "La dette nette vaut " + formaterValeur(lev, "fois") + " l'EBITDA, sous le plafond bancaire de " + formaterNombre(p.PLAFOND, 2) + ".");
  if (typeof div === "number" && div < 1) pts.push("La couverture des dividendes est de " + formaterValeur(div, "fois") + " : le dividende n'est pas payé par le cash libre.");
  else if (typeof ccc === "number") pts.push("Le cycle de cash est de " + formaterValeur(ccc, "jours") + " ; la couverture du service de la dette est de " + formaterValeur(dscr, "fois") + ".");
  return pts.slice(0, 3);
}

/* =====================================================================
   6. AFFICHAGE
   ===================================================================== */

const Etat = {
  modele: null, empreinte: null, erreurInitiale: null, chargement: true,
  familleOuvertes: new Set(), graphiques: [], observateurs: [], dejaAnime: new Set(), alerte: null
};
const reduireAnimations = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Formats à la française ---------- */
function formaterNombre(x, decimales) {
  if (typeof x !== "number" || !Number.isFinite(x)) return "n.s.";
  const arrondi = Number(Math.abs(x).toFixed(decimales));
  const [ent, dec] = arrondi.toFixed(decimales).split(".");
  const entier = ent.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const corps = dec ? entier + "," + dec : entier;
  return (x < 0 && arrondi !== 0 ? "− " : "") + corps;
}
function formaterKmad(dh, fixe) {
  if (typeof dh !== "number") return "n.s.";
  const k = dh / 1000;
  if (fixe) return formaterNombre(k, 1);
  const unDec = Number(k.toFixed(1));
  return formaterNombre(k, Number.isInteger(unDec) ? 0 : 1);
}
function decouperValeur(valeur, unite) {
  if (typeof valeur !== "number") return { texte: typeof valeur === "string" ? valeur : "n.s.", unite: "" };
  const u = normaliser(unite);
  if (u === "dh" || u === "mad") return { texte: formaterKmad(valeur), unite: "k MAD" };
  if (u === "jours" || u === "jour") return { texte: formaterNombre(valeur, 1), unite: "j" };
  if (u === "fois") return { texte: formaterNombre(valeur, 2), unite: "×" };
  return { texte: formaterNombre(valeur, 2), unite: "" };
}
function formaterValeur(valeur, unite) {
  const d = decouperValeur(valeur, unite);
  return d.unite ? d.texte + " " + d.unite : d.texte;
}
function formaterVariation(valeur, unite) {
  if (typeof valeur !== "number") return "n.s.";
  const d = decouperValeur(valeur, unite);
  const signe = valeur > 0 && d.texte !== "0" && !/^0(,0+)?$/.test(d.texte) ? "+ " : "";
  return signe + d.texte + (d.unite ? " " + d.unite : "");
}
function formaterHeure(date) {
  if (!date) return "—";
  return date.getHours() + " h " + String(date.getMinutes()).padStart(2, "0");
}
function ilYa(date) {
  if (!date) return "";
  const s = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
  if (s < 60) return "il y a " + s + " s";
  const m = Math.floor(s / 60);
  if (m < 60) return "il y a " + m + " min";
  return "à " + formaterHeure(date);
}

/* ---------- Feux : couleur + icône + mot ---------- */
function infosFeu(feu) {
  if (feu === "VERT") return { classe: "vert", mot: "Vert", icone: "check" };
  if (feu === "AMBRE") return { classe: "orange", mot: "Orange", icone: "alerte" };
  if (feu === "ROUGE") return { classe: "rouge", mot: "Rouge", icone: "croix" };
  return { classe: "neutre", mot: "Sans seuil", icone: "tiret" };
}
function pastille(feu, prefixe) {
  const i = infosFeu(feu);
  return el("span", { classe: "pastille " + i.classe }, [icone(i.icone), (prefixe ? prefixe + " " : "") + i.mot]);
}
function nomCourt(libelle) { return String(libelle || "").replace(/\s*\([^()]*\)\s*$/, "").trim(); }
function kpi(code) { return Etat.modele ? Etat.modele.kpis.find(k => k.code === code) : null; }
function familleDuKpi(code) { return FAMILLES.find(f => f.codes.includes(code)); }

/* ---------- Routage (hash) : Situation TFT → Famille → KPI ---------- */
function routeCourante() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [type, id] = h.split("/");
  if (type === "familles") return { page: "familles" };
  if (type === "famille" && FAMILLES.some(f => f.id === id)) return { page: "famille", id };
  if (type === "kpi" && FORMAT_ATTENDU.kpi.codes.includes(id)) return { page: "kpi", id };
  return { page: "situation" };
}
const lienSituation = "#/situation", lienFamilles = "#/familles";
const lienFamille = (id) => "#/famille/" + id;
const lienKpi = (code) => "#/kpi/" + code;

/* ---------- Menu latéral (ordinateur) ---------- */
function dessinerMenu() {
  const nav = document.getElementById("menu");
  const defilement = nav.scrollTop;
  vider(nav);
  const route = routeCourante();
  nav.appendChild(el("a", { classe: "marque", href: lienSituation, "aria-label": "Atlas Distribution SA, accueil" }, [
    el("span", { classe: "logo" }, icone("logo")),
    el("span", { classe: "nom" }, ["Atlas Distribution", el("small", { texte: "TFT IAS 7 · 2027" })])
  ]));
  nav.appendChild(el("button", { classe: "bouton-icone seulement-rail", type: "button", style: "margin: 0 18px 8px", "aria-label": "Déplier le menu", onclick: () => nav.classList.toggle("ouvert") }, icone("menu")));
  nav.appendChild(arbreNavigation(route, false));
  nav.appendChild(el("div", { classe: "seulement-ouvert", id: "sync-menu" }));
  nav.appendChild(el("div", { classe: "seulement-rail", id: "sync-rail" }));
  nav.scrollTop = defilement;
  dessinerOngletsBas(route);
  dessinerPanneauxSync();
}

function arbreNavigation(route, dansVolet) {
  const liste = el("ul", { classe: "nav-liste" });
  const actif = (cond) => cond ? "page" : null;
  liste.appendChild(el("li", { classe: "nav-item" }, el("a", { classe: "nav-lien", href: lienSituation, "aria-current": actif(route.page === "situation"), onclick: fermerVolet }, [icone("situation"), el("span", { classe: "libelle", texte: "Situation TFT" })])));
  liste.appendChild(el("li", { classe: "nav-item" }, el("a", { classe: "nav-lien", href: lienFamilles, "aria-current": actif(route.page === "familles"), onclick: fermerVolet }, [icone("familles"), el("span", { classe: "libelle", texte: "Les KPI par famille" })])));
  for (const f of FAMILLES) {
    const ouverte = Etat.familleOuvertes.has(f.id) || (route.page === "kpi" && f.codes.includes(route.id) && !Etat.familleOuvertes.has("!" + f.id));
    const idSous = (dansVolet ? "v-" : "m-") + "sous-" + f.id;
    const feu = Etat.modele ? feuFamille(f, Etat.modele) : "–";
    const fi = infosFeu(feu);
    const item = el("li", { classe: "nav-item" });
    const lienF = el("a", { classe: "nav-lien", href: lienFamille(f.id), "aria-current": actif(route.page === "famille" && route.id === f.id), title: f.titre, onclick: fermerVolet }, [
      icone(f.icone),
      Etat.modele ? el("span", { classe: "point-feu " + fi.classe + " icone-feu-rail seulement-rail", "aria-hidden": "true" }) : null,
      el("span", { classe: "libelle" }, [f.titre + " ", el("span", { classe: "legende", texte: "(" + f.codes.length + ")" })]),
      Etat.modele ? el("span", { classe: "libelle seulement-ouvert" }, pastille(feu)) : null
    ]);
    item.appendChild(el("div", { classe: "nav-famille" }, [
      lienF,
      el("button", { classe: "deplier seulement-ouvert", type: "button", "aria-expanded": ouverte ? "true" : "false", "aria-controls": idSous, "aria-label": (ouverte ? "Replier " : "Déplier ") + f.titre,
        onclick: (e) => { e.preventDefault(); basculerFamille(f.id, ouverte); } }, icone("chevron"))
    ]));
    if (ouverte) {
      const sous = el("ul", { classe: "nav-sous seulement-ouvert", id: idSous });
      for (const c of f.codes) {
        const k = kpi(c);
        sous.appendChild(el("li", {}, el("a", { classe: "nav-lien", href: lienKpi(c), "aria-current": actif(route.page === "kpi" && route.id === c), onclick: fermerVolet }, [
          el("span", { classe: "code", texte: c }),
          el("span", { classe: "libelle", texte: k ? nomCourt(k.libelle) : c }),
          k ? pastille(k.feuN) : null
        ])));
      }
      item.appendChild(sous);
    }
    liste.appendChild(item);
  }
  if (dansVolet) liste.classList.add("dans-volet");
  return liste;
}
function basculerFamille(id, etaitOuverte) {
  if (etaitOuverte) { Etat.familleOuvertes.delete(id); Etat.familleOuvertes.add("!" + id); }
  else { Etat.familleOuvertes.add(id); Etat.familleOuvertes.delete("!" + id); }
  const actifAvant = document.activeElement && document.activeElement.getAttribute("aria-controls");
  dessinerMenu();
  if (document.getElementById("volet").classList.contains("visible")) dessinerVolet();
  if (actifAvant) {
    const cible = document.querySelector('[aria-controls="' + actifAvant + '"]') || document.querySelector('[aria-controls="' + actifAvant.replace(/^m-/, "v-") + '"]');
    if (cible) cible.focus();
    else {
      const b = Array.from(document.querySelectorAll(".deplier")).find(x => (x.getAttribute("aria-label") || "").endsWith(FAMILLES.find(f => f.id === id).titre));
      if (b) b.focus();
    }
  }
}

/* ---------- Téléphone : onglets en bas et volet ---------- */
function dessinerOngletsBas(route) {
  const nav = document.getElementById("onglets-bas");

let elementAvantVolet = null;

  elementAvantVolet = document.activeElement;
