/* ---------- Panneau de synchronisation (menu, rail, téléphone, volet) ---------- */
function texteEtat() {
  const base = ETATS_SYNC[Sync.statut] || "";
  if (Sync.statut === "ok" && Sync.mode === "import" && Sync.derniereMaj) return "Fichier importé · mis à jour " + ilYa(Sync.derniereMaj);
  if (Sync.statut === "ok" && Sync.derniereMaj) return base + " · mis à jour " + ilYa(Sync.derniereMaj);
  return base;
}
function libelleMode() {
  if (Sync.mode === "direct") return "Direct (suivi du fichier)";
  if (Sync.mode === "en-ligne") return "En ligne (" + FORMAT_ATTENDU.fichierEnLigne + ")";
  if (Sync.mode === "import") return "Import (une seule fois)";
  return "—";
}
function infobulleSync() {
  const lignes = ["Synchronisation : " + (Sync.actif ? "activée" : "désactivée"), texteEtat()];
  if (Sync.nomFichier) lignes.push("Fichier : " + Sync.nomFichier);
  lignes.push("Mode : " + libelleMode());
  if (Sync.mode === "en-ligne" && !estLocal) lignes.push("GitHub peut mettre jusqu'à 10 minutes pour publier une nouvelle version du fichier.");
  if (Sync.raison) lignes.push(Sync.raison);
  return lignes.join("\n");
}
function interrupteur(lieu) {
  return el("button", { classe: "interrupteur", type: "button", role: "switch", "aria-checked": Sync.actif ? "true" : "false", "aria-label": "Synchronisation", dataset: { cle: "interrupteur-" + lieu }, onclick: basculerSynchro });
}
function lignesEtat(compact) {
  return el("div", { classe: "etat", title: infobulleSync() }, [
    el("span", { classe: "point-etat " + Sync.statut, "aria-hidden": "true" }),
    el("span", { classe: "texte" }, [el("span", { classe: "mot", "data-etat-texte": "1", texte: compact ? (ETATS_SYNC[Sync.statut] || "") : texteEtat() })])
  ]);
}
function boutonsSync(lieu) {
  const actions = el("div", { classe: "sync-actions" });
  if (Sync.statut === "reconnexion") actions.appendChild(el("button", { classe: "bouton petit principal plein", type: "button", dataset: { cle: "reconnecter-" + lieu }, onclick: reconnecter }, [icone("reessayer"), "Reconnecter"]));
  if (supporteAccesDirect) actions.appendChild(el("button", { classe: "bouton petit plein", type: "button", dataset: { cle: "connecter-" + lieu }, onclick: connecterFichier }, [icone("lien"), "Connecter mon fichier Excel"]));
  actions.appendChild(el("button", { classe: "bouton petit plein", type: "button", dataset: { cle: "importer-" + lieu }, onclick: ouvrirImport }, [icone("importer"), "Importer un fichier"]));
  if (Sync.poignee || Sync.mode || Etat.modele) actions.appendChild(el("button", { classe: "bouton petit discret plein", type: "button", dataset: { cle: "effacer-" + lieu }, onclick: effacerDonnees }, [icone("corbeille"), "Effacer mes données"]));
  return actions;
}
function panneauComplet(lieu) {
  const p = el("section", { classe: "sync verre", "aria-label": "Synchronisation avec Excel" });
  p.appendChild(el("div", { classe: "sync-entete" }, [el("span", { classe: "titre" }, [icone("sync"), "Synchronisation"]), interrupteur(lieu)]));
  p.appendChild(lignesEtat(false));
  if (Sync.raison && (Sync.statut === "erreur" || Sync.statut === "reconnexion")) p.appendChild(el("p", { classe: "sync-raison", texte: Sync.raison }));
  const dl = el("dl", { classe: "sync-infos" });
  dl.appendChild(el("dt", { texte: "Fichier" })); dl.appendChild(el("dd", { texte: Sync.nomFichier || "—" }));
  dl.appendChild(el("dt", { texte: "Mise à jour" })); dl.appendChild(el("dd", { texte: Sync.derniereMaj ? formaterHeure(Sync.derniereMaj) : "—" }));
  dl.appendChild(el("dt", { texte: "Mode" })); dl.appendChild(el("dd", { texte: libelleMode() }));
  p.appendChild(dl);
  p.appendChild(boutonsSync(lieu));
  if (!supporteAccesDirect) p.appendChild(el("p", { classe: "sync-note", texte: "Le suivi en direct fonctionne avec Chrome ou Edge sur ordinateur. Ici, importez à nouveau le fichier après chaque modification." }));
  if (Sync.mode === "en-ligne" && !estLocal) p.appendChild(el("p", { classe: "sync-note", texte: "Version en ligne relue toutes les 60 s. GitHub peut mettre jusqu'à 10 minutes pour publier une nouvelle version du fichier." }));
  return p;
}
function dessinerPanneauxSync() {
  const actif = document.activeElement;
  const cleFocus = actif && actif.dataset ? actif.dataset.cle : null;
  const nav = document.getElementById("menu");
  let auClavier = false;
  try { auClavier = !!actif && actif.matches(":focus-visible"); } catch (e) { auClavier = true; }
  if (cleFocus && nav && nav.contains(actif) && auClavier) garderMenuOuvert(nav);
  const menu = document.getElementById("sync-menu");
  if (menu) { vider(menu); menu.appendChild(panneauComplet("menu")); }
  const rail = document.getElementById("sync-rail");
  if (rail) {
    vider(rail);
    rail.appendChild(el("div", { classe: "sync-rail", role: "img", title: infobulleSync(), "aria-label": infobulleSync() }, [
      icone("sync"), el("span", { classe: "point-etat " + Sync.statut, "aria-hidden": "true" })
    ]));
  }
  const volet = document.getElementById("sync-volet");
  if (volet) { vider(volet); volet.appendChild(panneauComplet("volet")); }
  const bande = document.getElementById("bande-mobile");
  if (bande) {
    vider(bande);
    bande.appendChild(lignesEtat(true));
    bande.appendChild(interrupteur("bande"));
    bande.appendChild(el("button", { classe: "bouton-icone", type: "button", "aria-label": supporteAccesDirect ? "Connecter mon fichier Excel" : "Importer un fichier", onclick: supporteAccesDirect ? connecterFichier : ouvrirImport }, icone(supporteAccesDirect ? "lien" : "importer")));
    if (Sync.statut === "reconnexion") bande.appendChild(el("button", { classe: "bouton petit principal", type: "button", onclick: reconnecter, texte: "Reconnecter" }));
  }
  if (cleFocus && !document.contains(actif)) {
    const cible = document.querySelector('[data-cle="' + cleFocus + '"]');
    if (cible) cible.focus({ preventScroll: true });
  }
}
/* Le menu reste déplié pendant qu'un de ses boutons est redessiné, pour ne pas perdre le focus clavier */
function garderMenuOuvert(nav) {
  nav.classList.add("ouvert");
  if (nav.dataset.surveille) return;
  nav.dataset.surveille = "1";
  nav.addEventListener("focusout", (e) => {
    if (e.relatedTarget && nav.contains(e.relatedTarget)) return;
    setTimeout(() => { if (!nav.contains(document.activeElement)) nav.classList.remove("ouvert"); }, 0);
  });
}
/* Le texte « il y a 12 s » avance chaque seconde, sans redessiner la page */
setInterval(() => {
  if (Sync.statut !== "ok") return;
  document.querySelectorAll("#sync-menu [data-etat-texte], #sync-volet [data-etat-texte]").forEach(n => { n.textContent = texteEtat(); });
}, 1000);

/* ---------- Toasts et alertes ---------- */
function afficherToast(texte, type) {
  const zone = document.getElementById("toasts");
  const t = el("div", { classe: "toast verre" + (type ? " " + type : "") }, [icone(type === "erreur" ? "alerte" : "check"), el("span", { texte })]);
  zone.appendChild(t);
  while (zone.children.length > 3) zone.removeChild(zone.firstChild);
  setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 5000);
}
function afficherAlerte(erreur, avertissement) {
  Etat.alerte = { titre: erreur.message, details: erreur.details || [], avertissement: !!avertissement };
  dessinerAlerte();
}
function effacerAlerte() { Etat.alerte = null; dessinerAlerte(); }
function dessinerAlerte() {
  const zone = document.getElementById("zone-alerte");
  if (!zone) return;
  vider(zone);
  const a = Etat.alerte;
  if (!a) return;
  if (!Etat.modele && Etat.erreurInitiale && !a.avertissement) return; /* la page d'erreur affiche déjà le détail */
  const details = a.details.slice(0, 8);
  if (a.details.length > 8) details.push("… et " + (a.details.length - 8) + " autres remarques.");
  zone.appendChild(el("section", { classe: "alerte verre" + (a.avertissement ? " avertissement" : ""), role: a.avertissement ? "status" : "alert" }, [
    el("div", { classe: "haut" }, [
      el("h2", {}, [icone("alerte"), a.titre]),
      el("button", { classe: "bouton-icone", type: "button", "aria-label": "Fermer l'alerte", onclick: effacerAlerte }, icone("fermer"))
    ]),
    !a.avertissement && Etat.modele ? el("p", { classe: "legende", style: "margin-top: 8px", texte: "Les dernières données valides restent affichées." }) : null,
    details.length ? el("ul", {}, details.map(d => el("li", { texte: d }))) : null
  ]));
}

/* ---------- Application d'une nouvelle version des données ---------- */
function appliquerModele(modele, empreinte) {
  const ancien = Etat.modele;
  const nbModifs = ancien ? compterDifferences(ancien, modele) : 0;
  const modifies = kpiModifies(ancien, modele);
  Etat.modele = modele;
  Etat.empreinte = empreinte;
  Etat.erreurInitiale = null;
  Etat.chargement = false;
  const defX = window.scrollX, defY = window.scrollY;
  const focusCle = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.cle : null;
  dessinerMenu();
  dessinerPage({ conserverDefilement: true });
  window.scrollTo(defX, defY);
  if (focusCle) { const n = document.querySelector('[data-cle="' + focusCle + '"]'); if (n) n.focus({ preventScroll: true }); }
  if (ancien) {
    afficherToast("Données mises à jour à " + formaterHeure(new Date()) + " : " + nbModifs + " valeur" + (nbModifs > 1 ? "s" : "") + " modifiée" + (nbModifs > 1 ? "s" : "") + ".");
    if (!reduireAnimations()) illuminer(modifies);
  } else {
    afficherToast("Données chargées : " + modele.kpis.length + " KPI et " + modele.tft.lignes.filter(l => l.code).length + " lignes du TFT.");
  }
}
function illuminer(codes) {
  for (const c of codes) {
    document.querySelectorAll('[data-kpi="' + c + '"]').forEach(n => {
      n.classList.add("eclat");
      setTimeout(() => n.classList.remove("eclat"), REGLAGES.dureeEclat);
    });
  }
}

/* ---------- Pages ---------- */
function detruireGraphiques() {
  for (const o of Etat.observateurs) o.disconnect();
  for (const g of Etat.graphiques) { try { g.dispose(); } catch (e) { /* déjà détruit */ } }
  Etat.graphiques = []; Etat.observateurs = [];
}
function dessinerPage(options) {
  const main = document.getElementById("contenu");
  detruireGraphiques();
  vider(main);
  main.appendChild(el("div", { id: "zone-alerte" }));
  dessinerAlerte();
  const route = routeCourante();
  if (Etat.chargement && !Etat.modele && !Etat.erreurInitiale) { main.appendChild(pageChargement()); return; }
  if (!Etat.modele) { main.appendChild(Etat.erreurInitiale ? pageErreur(Etat.erreurInitiale) : pageVide()); return; }
  if (normaliser(Etat.modele.controles.statut) !== "conforme") {
    document.body.classList.add("disjoncte");
    main.appendChild(pageDisjoncteur(Etat.modele.controles));
    return;
  }
  document.body.classList.remove("disjoncte");
  if (route.page === "situation") pageSituation(main);
  else if (route.page === "familles") pageFamilles(main);
  else if (route.page === "famille") pageFamille(main, FAMILLES.find(f => f.id === route.id));
  else if (route.page === "kpi") pageKpi(main, route.id);
  main.appendChild(piedDePage());
  Etat.dejaAnime.add(route.page + (route.id || ""));
}

function pageChargement() {
  const s = el("div", { "aria-busy": "true", "aria-label": "Chargement des données" });
  s.appendChild(el("p", { classe: "visuellement-cache", texte: "Chargement des données…" }));

/* Chiffres qui montent (sauf si « réduire les animations ») */
function compteur(valeur, unite, texteFinal) {
  const span = el("span", { texte: texteFinal });
  const cle = routeCourante().page + (routeCourante().id || "");
  if (typeof valeur !== "number" || reduireAnimations() || Etat.dejaAnime.has(cle)) return span;
  const debut = performance.now(), duree = 800;
  const etape = (maintenant) => {
    const p = Math.min(1, (maintenant - debut) / duree);
    const e = 1 - Math.pow(1 - p, 3);
    span.textContent = p < 1 ? decouperValeur(valeur * e, unite).texte : texteFinal;
    if (p < 1 && document.contains(span)) requestAnimationFrame(etape);
  };
  requestAnimationFrame(etape);
  return span;
}

/* Sparkline : uniquement les années présentes dans le fichier (2 points), aucun point inventé */
function sparkline(k) {
  const points = [k.n1, k.n].filter(x => typeof x === "number");
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "sparkline");
  svg.setAttribute("viewBox", "0 0 132 34");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Tendance 2026 → 2027 : " + formaterValeur(k.n1, k.unite) + " puis " + formaterValeur(k.n, k.unite));
  if (points.length === 0) return svg;
  const min = Math.min(...points), max = Math.max(...points);
  const y = (v) => max === min ? 17 : 30 - (v - min) / (max - min) * 26;
  const x = (i) => points.length === 1 ? 126 : 6 + i * (120 / (points.length - 1));
  const ligne = document.createElementNS(SVG_NS, "polyline");
  ligne.setAttribute("class", "ligne");
  ligne.setAttribute("points", points.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" "));
  svg.appendChild(ligne);
  const point = document.createElementNS(SVG_NS, "circle");
  point.setAttribute("class", "point");
  point.setAttribute("cx", x(points.length - 1).toFixed(1));
  point.setAttribute("cy", y(points[points.length - 1]).toFixed(1));
  point.setAttribute("r", "2.6");
  svg.appendChild(point);
  return svg;
}

function exporterTft(m) {
  try {
    const lignes = [["Ligne", "Libellé", "2027 (k MAD)", "2026 (k MAD)"]];
    for (const l of m.tft.lignes) {
      if (!l.code) { lignes.push(["", neutraliserCellule(l.libelle), "", ""]); continue; }
      lignes.push([neutraliserCellule(l.code), neutraliserCellule(l.libelle), Math.round(l.n / 100) / 10, Math.round(l.n1 / 100) / 10]);
    }
    lignes.push([]);
    lignes.push([neutraliserCellule("Source : " + (Sync.nomFichier || "fichier connecté") + " · export du " + new Date().toLocaleDateString("fr-FR"))]);
    const ws = XLSX.utils.aoa_to_sheet(lignes);
    ws["!cols"] = [{ wch: 8 }, { wch: 64 }, { wch: 16 }, { wch: 16 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "TFT 2027");
    XLSX.writeFile(wb, "TFT-ATLAS-2027.xlsx", { compression: true });
    afficherToast("Export Excel prêt : TFT-ATLAS-2027.xlsx.");
  } catch (e) {
    afficherToast("L'export n'a pas pu être créé. Réessayez.", "erreur");
  }
}

/* =====================================================================
   7. GRAPHIQUES (Apache ECharts)
   ===================================================================== */
const COULEURS = Object.freeze({ or: "#E0AE28", grenat: "#A3263B", blanc: "#FFFFFF", texte: "#E0AE28", texteDoux: "rgba(224,174,40,0.78)", grille: "rgba(255,255,255,0.07)" });
function baseOption() {
  return {
    backgroundColor: "transparent",
    animation: !reduireAnimations(), animationDuration: 900, animationEasing: "cubicOut",
    textStyle: { fontFamily: "Inter, system-ui, sans-serif", fontWeight: 300, color: COULEURS.texte },
    tooltip: { renderMode: "richText", backgroundColor: "rgba(8,8,8,0.96)", borderColor: "rgba(255,255,255,0.16)", textStyle: { color: "#FFFFFF", fontFamily: "Inter", fontWeight: 300, fontSize: 13 } },
    aria: { enabled: false }
  };
}
function creerGraphique(zone) {
  if (!window.echarts || !zone || !document.contains(zone)) return null;
  const g = echarts.init(zone, null, { renderer: "canvas" });
  Etat.graphiques.push(g);
  if ("ResizeObserver" in window) {
    const o = new ResizeObserver(() => { try { g.resize(); } catch (e) { /* graphique détruit */ } });
    o.observe(zone);
    Etat.observateurs.push(o);
  }
  return g;
}
function grapheVide(zone, texte) { vider(zone); zone.removeAttribute("role"); zone.appendChild(el("div", { classe: "vide-graphique", texte })); }
const estMobile = () => window.matchMedia("(max-width: 639px)").matches;

/* Cascade : trésorerie nette 2026 → flux → trésorerie nette 2027 */
function graphiqueCascade(zone, cascade) {
  if (!cascade.length) { grapheVide(zone, "Données absentes : onglet KPI, section 4 « Cascade »."); return; }
  const g = creerGraphique(zone); if (!g) return;
  const dernier = cascade.length - 1;
  const donnees = cascade.map((b, i) => {
    const total = i === 0 || i === dernier;
    const debut = total ? 0 : b.debut, fin = b.fin;
    const delta = fin - debut;
    return { value: [i, debut, fin, total ? fin : delta], couleur: total ? COULEURS.blanc : (delta >= 0 ? COULEURS.or : COULEURS.grenat), total };
  });
  const tousLesNiveaux = donnees.flatMap(d => [d.value[1], d.value[2]]);
  const mobile = estMobile();
  g.setOption(Object.assign(baseOption(), {
    grid: { left: mobile ? 48 : 72, right: 16, top: 48, bottom: mobile ? 84 : 56 },
    xAxis: { type: "category", data: cascade.map(b => b.barre), axisLine: { lineStyle: { color: "rgba(255,255,255,.18)" } }, axisTick: { show: false },
      axisLabel: { color: COULEURS.texte, fontSize: 12, interval: 0, width: mobile ? 64 : 120, overflow: "break", rotate: 0 } },
    yAxis: { type: "value", min: Math.min(0, ...tousLesNiveaux) * 1.15, max: Math.max(0, ...tousLesNiveaux) * 1.15, splitLine: { lineStyle: { color: COULEURS.grille } },
      axisLabel: { color: COULEURS.texteDoux, fontSize: 11, formatter: (v) => formaterKmad(v) } },
    tooltip: Object.assign(baseOption().tooltip, { trigger: "item", formatter: (p) => cascade[p.value[0]].barre + "\n" + (donnees[p.value[0]].total ? "" : "Variation : ") + formaterVariation(p.value[3], "DH") }),
    series: [{
      type: "custom", data: donnees.map(d => d.value),
      renderItem: (params, api) => {
        const i = api.value(0), a = api.value(1), b = api.value(2), montant = api.value(3);
        const haut = api.coord([i, Math.max(a, b)]), bas = api.coord([i, Math.min(a, b)]);
        const largeur = api.size([1, 0])[0] * 0.56;
        const couleur = donnees[i].couleur;
        const enfants = [{ type: "rect", shape: { x: haut[0] - largeur / 2, y: haut[1], width: largeur, height: Math.max(2, bas[1] - haut[1]), r: 4 },
          style: { fill: couleur, shadowBlur: 18, shadowColor: couleur === COULEURS.blanc ? "rgba(255,255,255,.25)" : couleur } }];
        const texte = donnees[i].total ? formaterKmad(montant) : formaterVariation(montant, "DH").replace(" k MAD", "");
        const hauteur = bas[1] - haut[1];
        if (!donnees[i].total && hauteur > 40) {
          enfants.push({ type: "text", style: { text: texte, x: haut[0], y: (haut[1] + bas[1]) / 2, align: "center", verticalAlign: "middle",
            fill: couleur === COULEURS.or ? "#000000" : COULEURS.blanc, font: "400 " + (mobile ? 12 : 16) + "px Cinzel, serif" } });
        } else {
          const auDessus = donnees[i].total ? b >= 0 : montant >= 0;
          enfants.push({ type: "text", style: { text: texte, x: haut[0], y: auDessus ? haut[1] - 8 : bas[1] + 8, align: "center", verticalAlign: auDessus ? "bottom" : "top",
            fill: COULEURS.blanc, font: "400 " + (mobile ? 12 : 15) + "px Cinzel, serif" } });
        }
        if (i < dernier) {
          const suivant = api.coord([i + 1, b]);
          enfants.push({ type: "line", shape: { x1: haut[0] + largeur / 2, y1: api.coord([i, b])[1], x2: suivant[0] - largeur / 2, y2: suivant[1] }, style: { stroke: "rgba(255,255,255,.28)", lineDash: [3, 3], lineWidth: 1 } });
        }
        return { type: "group", children: enfants };
      },
      encode: { x: 0, y: [1, 2] }
    }]
  }));
}

/* Sankey : d'où vient l'argent et où il va (onglet TFT) */
function graphiqueSankey(zone, t) {
  const v = (c) => (t[c] ? t[c].n : 0);
  const flux = [
    { nom: "Flux opérationnel", montant: v("OT") },
    { nom: "Emprunts reçus", montant: v("F1") },
    { nom: "Investissements", montant: v("IT") },
    { nom: "Remboursements d'emprunts", montant: v("F2") },
    { nom: "Intérêts", montant: v("F3") },
    { nom: "Loyers IFRS 16", montant: v("F4") + v("F5") },
    { nom: "Dividendes", montant: v("F6") },
    { nom: v("V") < 0 ? "Baisse de la trésorerie" : "Hausse de la trésorerie", montant: -v("V") }
  ].filter(f => Math.abs(f.montant) > 0.5);
  if (!flux.length) { grapheVide(zone, "Données absentes : onglet TFT."); return; }
  const g = creerGraphique(zone); if (!g) return;
  const centre = "Cash de l'exercice";
  const mobile = estMobile();
  const noeuds = [{ name: centre, itemStyle: { color: COULEURS.blanc }, label: { position: mobile ? "top" : "top", color: COULEURS.blanc } }];
  const liens = [];
  for (const f of flux) {
    const source = f.montant > 0;
    noeuds.push({ name: f.nom, itemStyle: { color: source ? COULEURS.or : COULEURS.grenat }, label: { position: source ? "right" : "left" } });
    liens.push(source ? { source: f.nom, target: centre, value: f.montant, lineStyle: { color: COULEURS.or, opacity: 0.30 } } : { source: centre, target: f.nom, value: -f.montant, lineStyle: { color: COULEURS.grenat, opacity: 0.55 } });
  }
  g.setOption(Object.assign(baseOption(), {
    tooltip: Object.assign(baseOption().tooltip, { trigger: "item", formatter: (p) => p.dataType === "edge" ? p.data.source + " → " + p.data.target + "\n" + formaterValeur(p.data.value, "DH") : p.name + "\n" + formaterValeur(p.value, "DH") }),
    series: [{
      type: "sankey", left: mobile ? 8 : 24, right: mobile ? 8 : 24, top: 56, bottom: 16, nodeWidth: 14, nodeGap: mobile ? 12 : 16, layoutIterations: 0, draggable: false,
      data: noeuds, links: liens, emphasis: { focus: "adjacency" },
      label: { color: COULEURS.texte, fontSize: mobile ? 11 : 13, fontFamily: "Inter", fontWeight: 300,
        formatter: (p) => p.name + "\n{v|" + formaterKmad(p.value) + " k MAD}", rich: { v: { fontFamily: "Cinzel", color: COULEURS.blanc, fontSize: mobile ? 12 : 14, padding: [4, 0, 0, 0] } } },
      edgeLabel: { show: !mobile, color: "rgba(255,255,255,.85)", fontFamily: "Cinzel", fontSize: 12, formatter: (p) => formaterKmad(p.value) },
      lineStyle: { curveness: 0.5 }
    }]
  }));
}

/* Jauges : conversion, levier, couverture de la dette (onglet KPI, section 4) */
function graphiqueJauges(conteneur, m) {
  if (!m.jauges.length) { grapheVide(conteneur, "Données absentes : onglet KPI, section 4 « Jauge »."); return; }
  const codesParDefaut = ["K01", "K11", "K13"];
  const codeJauge = (nom, i) => {
    const n = normaliser(nom);
    if (n.includes("conversion")) return "K01";
    if (n.includes("dette nette")) return "K11";
    if (n.includes("couverture")) return "K13";
    return codesParDefaut[i];
  };
  m.jauges.slice(0, 3).forEach((j, i) => {
    const code = codeJauge(j.nom, i);
    const k = kpi(code) || {};
    const unite = k.unite || "ratio";
    const bloc = el("div", { classe: "jauge-bloc", dataset: { kpi: code } });
    const zone = el("div", { classe: "graphique jauge", role: "img", "aria-label": j.nom + " : " + formaterValeur(j.valeur, unite) + ", " + j.repereMot + " " + formaterNombre(j.repere, 2) });
    bloc.appendChild(el("h3", { texte: j.nom }));
    bloc.appendChild(zone);
    bloc.appendChild(el("p", { classe: "sous" }, [el("span", { classe: "num", texte: formaterValeur(j.valeur, unite) }), " · " + j.repereMot + " " + formaterNombre(j.repere, 2)]));
    if (k.feuN) bloc.appendChild(pastille(k.feuN));
    conteneur.appendChild(bloc);
    const g = creerGraphique(zone); if (!g) return;
    const max = j.maximum || 1;
    const commun = { type: "gauge", min: 0, max, startAngle: 200, endAngle: -20, radius: "92%", center: ["50%", "60%"], splitNumber: 4, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false }, title: { show: false } };
    g.setOption(Object.assign(baseOption(), {
      series: [
        Object.assign({}, commun, {
          progress: { show: true, width: 12, roundCap: true, itemStyle: { color: COULEURS.or, shadowBlur: 16, shadowColor: "rgba(224,174,40,.45)" } },
          axisLine: { roundCap: true, lineStyle: { width: 12, color: [[1, "rgba(255,255,255,0.08)"]] } },
          pointer: { show: false }, anchor: { show: false },
          detail: { valueAnimation: !reduireAnimations(), offsetCenter: [0, "8%"], fontFamily: "Cinzel", fontSize: 30, color: COULEURS.blanc, formatter: (x) => formaterNombre(x, 2) },
          data: [{ value: Math.max(0, Math.min(max, j.valeur)) }]
        }),
        Object.assign({}, commun, {
          axisLine: { show: false }, progress: { show: false }, detail: { show: false }, anchor: { show: false },
          pointer: { show: true, icon: "rect", length: 18, width: 3, offsetCenter: [0, "-74%"], itemStyle: { color: COULEURS.blanc } },
          data: [{ value: Math.max(0, Math.min(max, j.repere || 0)) }]
        })
      ]
    }));
  });
}

/* Entonnoir : EBITDA → flux opérationnel → après loyers → après service des emprunts */
function graphiqueEntonnoir(zone, entonnoir) {
  const etapes = entonnoir.filter(e => typeof e.valeur === "number");
  if (!etapes.length) { grapheVide(zone, "Données absentes : onglet KPI, section 4 « Entonnoir »."); return; }
  const g = creerGraphique(zone); if (!g) return;
  const max = Math.max(...etapes.map(e => e.valeur));
  g.setOption(Object.assign(baseOption(), {
    tooltip: Object.assign(baseOption().tooltip, { trigger: "item", formatter: (p) => p.name + "\n" + formaterValeur(p.value, "DH") }),
    series: [{
      type: "funnel", sort: "none", min: 0, max, minSize: "46%", maxSize: "100%", left: "6%", right: "6%", top: 12, bottom: 12, gap: 6,
      data: etapes.map((e, i) => ({ name: e.etape, value: e.valeur, itemStyle: { color: i === 0 ? COULEURS.or : "rgba(255,255,255," + (0.96 - i * 0.07).toFixed(2) + ")", borderWidth: 0 } })),
      label: { show: true, position: "inside", color: "#000", fontFamily: "Inter", fontWeight: 300, fontSize: 13,
        formatter: (p) => {
          const i = p.dataIndex;
          const ecart = i > 0 ? etapes[i].valeur - etapes[i - 1].valeur : null;
          return p.name + "\n{v|" + formaterKmad(p.value) + "}" + (ecart !== null ? "  {d|" + formaterKmad(ecart) + "}" : "");
        },
        rich: { v: { fontFamily: "Cinzel", fontSize: 16, color: "#000" }, d: { fontFamily: "Cinzel", fontSize: 13, color: "#7A1528" } } },
      labelLine: { show: false }
    }]
  }));
}

/* Bullet chart : délais face à leur seuil vert (onglet KPI, section 5) */
function graphiqueBullet(zone, bullet, kpis) {
  const lignes = bullet.filter(b => typeof b.valeur === "number");
  if (!lignes.length) { grapheVide(zone, "Données absentes : onglet KPI, section 5 « Poste du cycle de cash »."); return; }
  const g = creerGraphique(zone); if (!g) return;
  const noms = lignes.map(b => "Délai " + b.poste);
  const max = Math.max(...lignes.flatMap(b => [b.valeur, b.seuil || 0])) * 1.25;
  g.setOption(Object.assign(baseOption(), {
    grid: { left: 140, right: 32, top: 24, bottom: 36 },
    xAxis: { type: "value", max: Math.ceil(max / 10) * 10, splitLine: { lineStyle: { color: COULEURS.grille } }, axisLabel: { color: COULEURS.texteDoux, formatter: (v) => v + " j" } },
    yAxis: { type: "category", data: noms, inverse: true, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: COULEURS.texte, fontSize: 13 } },
    tooltip: Object.assign(baseOption().tooltip, { trigger: "item", formatter: (p) => noms[p.dataIndex] + "\n2027 : " + formaterNombre(lignes[p.dataIndex].valeur, 1) + " j · seuil vert : " + formaterNombre(lignes[p.dataIndex].seuil, 0) + " j" }),
    series: [
      { type: "bar", data: lignes.map(() => Math.ceil(max / 10) * 10), barWidth: 26, silent: true, itemStyle: { color: "rgba(255,255,255,0.04)", borderRadius: 6 }, barGap: "-100%", animation: false },
      { type: "bar", data: lignes.map(b => b.valeur), barWidth: 12, itemStyle: { color: COULEURS.or, borderRadius: 6, shadowBlur: 12, shadowColor: "rgba(224,174,40,.35)" },
        label: { show: true, position: "right", fontFamily: "Cinzel", color: COULEURS.blanc, fontSize: 14, formatter: (p) => formaterNombre(p.value, 1) + " j" } },
      { type: "scatter", data: lignes.map((b, i) => [b.seuil, i]), symbol: "rect", symbolSize: [3, 30], itemStyle: { color: COULEURS.blanc }, z: 5,
        label: { show: true, position: "top", color: COULEURS.texteDoux, fontSize: 11, formatter: (p) => "seuil vert " + formaterNombre(p.value[0], 0) + " j" } }
    ]
  }));
}

/* =====================================================================
   8. FOND ANIMÉ · particules reliées, reflets noirs brillants
   ===================================================================== */
function demarrerParticules() {
  const canvas = document.getElementById("particules");
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d");
  let largeur = 0, hauteur = 0, points = [], animation = null;
  const fixe = () => reduireAnimations() || window.matchMedia("(max-width: 899px), (pointer: coarse)").matches;
  const redimensionner = () => {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    largeur = window.innerWidth; hauteur = window.innerHeight;
    canvas.width = largeur * ratio; canvas.height = hauteur * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const nb = Math.round(Math.min(70, Math.max(24, largeur * hauteur / 26000)));
    points = Array.from({ length: nb }, () => ({ x: Math.random() * largeur, y: Math.random() * hauteur, vx: (Math.random() - 0.5) * 0.16, vy: (Math.random() - 0.5) * 0.16, r: 0.8 + Math.random() * 1.4 }));
  };
  const dessiner = () => {
    ctx.clearRect(0, 0, largeur, hauteur);
    for (let i = 0; i < points.length; i++) {
      const a = points[i];
      for (let j = i + 1; j < points.length; j++) {
        const b = points[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < 160) { ctx.strokeStyle = "rgba(255,255,255," + (0.05 * (1 - d / 160)).toFixed(3) + ")"; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
    }
    for (const p of points) {
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      grad.addColorStop(0, "rgba(255,255,255,0.22)"); grad.addColorStop(0.35, "rgba(255,255,255,0.05)"); grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#050505"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  };
  const boucle = () => {
    for (const p of points) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -20) p.x = largeur + 20; if (p.x > largeur + 20) p.x = -20;
      if (p.y < -20) p.y = hauteur + 20; if (p.y > hauteur + 20) p.y = -20;
    }
    dessiner();
    animation = requestAnimationFrame(boucle);
  };
  const relancer = () => {
    cancelAnimationFrame(animation); animation = null;
    redimensionner();
    if (fixe() || document.hidden) dessiner(); else boucle();
  };
  window.addEventListener("resize", relancer);
  document.addEventListener("visibilitychange", relancer);
  window.matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", () => { relancer(); dessinerPage({ conserverDefilement: true }); });
  relancer();
}

/* =====================================================================
   9. DÉMARRAGE
   ===================================================================== */
async function demarrer() {
  if (estEncadre) return;
  Sync.actif = lireReglageSynchro();
  dessinerMenu();
  dessinerPage();
  demarrerParticules();
  installerDepot();
  document.getElementById("entree-fichier").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; if (f) importerFichier(f); });
  document.getElementById("volet-fond").addEventListener("click", fermerVolet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { fermerVolet(); document.getElementById("menu").classList.remove("ouvert"); } });
  document.addEventListener("click", (e) => { const nav = document.getElementById("menu"); if (nav.classList.contains("ouvert") && !nav.contains(e.target)) nav.classList.remove("ouvert"); });
  window.addEventListener("hashchange", () => {
    document.getElementById("menu").classList.remove("ouvert");
    detruireGraphiques();
    dessinerMenu();
    dessinerPage();
    window.scrollTo(0, 0);
    const t = document.getElementById("titre-page");
    if (t) t.focus({ preventScroll: true });
  });
  /* L'onglet revenu au premier plan déclenche une vérification immédiate */
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Sync.actif && (Sync.mode === "direct" || Sync.mode === "en-ligne")) verifier(); });

  if (!window.XLSX || !window.echarts) {
    Etat.chargement = false;
    Etat.erreurInitiale = new ErreurLecture("Les bibliothèques de lecture et de graphiques n'ont pas pu être chargées. Vérifiez votre connexion Internet, puis réessayez.");
    dessinerPage();
    return;
  }
  try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, attendre(1500)]); } catch (e) { /* polices facultatives */ }

  /* 1) Le fichier déjà connecté (mode Direct) */
  const poignee = supporteAccesDirect ? await idb("lire") : null;
  if (poignee && typeof poignee.queryPermission === "function") {
    Sync.poignee = poignee; Sync.mode = "direct"; Sync.nomFichier = poignee.name;
    let perm = "prompt";
    try { perm = await poignee.queryPermission({ mode: "read" }); } catch (e) { perm = "prompt"; }
    if (perm === "granted") {
      await verifier();
      if (Etat.modele) return;
    } else {
      Etat.chargement = false;
      changerEtat("reconnexion", "Un clic sur « Reconnecter » suffit pour reprendre le suivi de « " + poignee.name + " ».");
    }
  }
  /* 2) donnees.xlsx à côté d'index.html (mode En ligne) */
  if (!Etat.modele && estEnLigne && Sync.mode !== "direct") {
    Sync.mode = "en-ligne";
    const ok = await verifierEnLigne(true);
    if (ok) { planifier(); return; }
    Sync.mode = null;
  }
  /* 3) Sinon : « Connecter mon fichier Excel » avec une zone de dépôt */
  Etat.chargement = false;
  if (Sync.statut !== "reconnexion") changerEtat("aucun");
  dessinerPage();
}

demarrer();
</script>
